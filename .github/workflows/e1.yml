name: e1-red

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: make validate (fuente única)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements.txt
      - run: make deps
      - run: make validate
      - name: El informe de validación versionado está al día
        run: git diff --exit-code docs/infra/e1/validacion.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validacion
          path: docs/infra/e1/validacion.md

  gitleaks:
    name: gitleaks (secretos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
