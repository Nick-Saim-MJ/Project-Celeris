# docs/fuentes/CE01/contenido-minimo.yaml — Contenido mínimo y rúbrica de CE01 S1 (E1–E4), en forma legible por máquina.
#
# La fuente oficial es el texto literal del EPE (área B, GTI) en docs/fuentes/CE01/E1-E4-contenido-y-rubrica.md.
# Este archivo solo lo estructura para que gestion/build_informe_ce01.py compruebe que el informe tiene todos los títulos
# del contenido mínimo y arme el anexo de autoevaluación.
#
# Estado: PRELIMINAR. Los títulos salen de la guía docs/celeris/Celeris-CE01-Gestion-TI.md v0.4 (B1.9, B2.7, B3.8, B4.6)
# porque el texto del EPE todavía no está en el repositorio (CI-99). Mientras `cotejado: false`:
#   - gestion/validate_ce01.py lo reporta como AVISO;
#   - el generador se niega a producir un informe (no se entrega nada armado sobre títulos supuestos).
# Al pegar el EPE: corregir cada `titulo` y `criterio` para que sea idéntico al texto literal, completar `excelente`
# con el descriptor literal del nivel Excelente y poner `cotejado: true`. El validador comprueba que cada título y cada
# criterio aparezcan tal cual en el texto literal.

meta:
  fuente_literal: docs/fuentes/CE01/E1-E4-contenido-y-rubrica.md
  fuente_preliminar: "docs/celeris/Celeris-CE01-Gestion-TI.md v0.4"
  cotejado: false
  cambio: CI-99

