# gestion/ce01.yaml — Fuente única de CE01 Gestión de TI (S1, E1–E4).
#
# Reglas (P0):
#   - Lo que ya existe en el repositorio NO se copia aquí: se referencia. Los supuestos viven en infra/trazabilidad.yaml,
#     el consumo y AWS en infra/centro_datos.yaml, los objetivos OB-x en infra/trazabilidad.yaml → objetivos_proyecto.
#   - Para usar un supuesto en un cálculo se declara su «lectura numérica»: el número y el texto exacto con el que aparece
#     en `valor`. gestion/ce01_datos.py falla si ese texto ya no está: si alguien cambia el supuesto, CE01 se entera (CI-97).
#   - Lo propio de CE01 (alternativas, criterios, riesgos, procesos, EDT, RACI) sí vive aquí, con su fuente.
#   - Ningún script de CE01 lee cifras de otro lado: todo pasa por gestion/ce01_datos.py.

meta:
  version: "0.1"
  fecha: "2026-11-25"
  equipo: "docs/celeris/Celeris-00-Marco-Comun.md#equipo"       # lo resuelve el cargador (no se copia)
  guia: "docs/celeris/Celeris-CE01-Gestion-TI.md v0.4"
  versiones_informe: { E1: "0.1", E2: "0.1", E3: "0.1", E4: "0.1" }

# --------------------------------------------------------------------------------------------------------------------
# Identidad visual de CE01 (CI-100). Única paleta para BPMN, EDT, draw.io, matplotlib y XLSX.
# Muestreada del logotipo UPeU de docs/infra/e1/portada-upeu.docx (no hay manual de marca en el repositorio).
# --------------------------------------------------------------------------------------------------------------------
estilo:
  fuente_paleta: "Logotipo UPeU de la portada institucional (muestreo de píxeles); ajustar si la universidad entrega su manual de marca"
  paleta:
    azul_upeu:      "#003865"   # principal: cabeceras, series 1, pool BPMN, nivel 0 de la EDT
    ambar_upeu:     "#F8A800"   # acento: series 2, destacados, carril Celeris en el TO-BE
    azul_medio:     "#2F5D8A"
    azul_claro:     "#8FA9C4"
    azul_muy_claro: "#DCE5EF"   # fondos y carriles
    ambar_claro:    "#FCD98A"
    gris_texto:     "#262626"
    gris_medio:     "#7F7F7F"
    gris_claro:     "#E7E9EC"
    blanco:         "#FFFFFF"
  texto_sobre:                  # color de texto legible sobre cada relleno (contraste ≥ 4,5:1)
    azul_upeu: blanco
    azul_medio: blanco
    ambar_upeu: gris_texto
    azul_claro: gris_texto
    azul_muy_claro: gris_texto
    ambar_claro: gris_texto
    gris_medio: blanco
    gris_claro: gris_texto
  series: [azul_upeu, ambar_upeu, azul_claro, gris_medio, azul_medio, ambar_claro]
  semaforo_riesgo:              # excepción semántica: siempre con el nivel escrito
    alto:  { color: "#C0392B", texto: "ALTO",  umbral_min: 15 }
    medio: { color: "#F8A800", texto: "MEDIO", umbral_min: 8 }
    bajo:  { color: "#2E8B57", texto: "BAJO",  umbral_min: 1 }
  tipografia: { principal: Calibri, alternativa: Arial }
  figura: { dpi: 200, ancho_h_cm: 25.7, alto_max_cm: 13.4, ancho_v_cm: 17.0 }   # CI-90
  numeracion:
    norma: IEEE
    figura: "Figura {e}.{n}."          # debajo de la figura; {e} = número del entregable
    tabla: "Tabla {e}.{n}."            # encima de la tabla
    fuente: "Fuente: {fuente}."         # debajo de figura o tabla
    palabras_min_interpretacion: 20     # párrafo posterior a cada figura

# --------------------------------------------------------------------------------------------------------------------
# Referencias a datos que ya existen (no copias)
# --------------------------------------------------------------------------------------------------------------------
referencias:
  objetivos: "infra/trazabilidad.yaml#objetivos_proyecto"
  consumo_w: "infra/centro_datos.yaml#energia.consumo_w"
  aws_lineas: "infra/centro_datos.yaml#aws.costo_mensual.lineas"
  aws_supuesto: "infra/centro_datos.yaml#aws.costo_mensual.supuesto"
  host: "infra/centro_datos.yaml#host"
  # Lectura numérica de cada supuesto que usa un cálculo: clave → [valor, texto exacto dentro de `valor`].
  supuestos:
    S-01: { pcs: [400, "400 PCs"] }
    S-02: { enlace_mbps: [300, "300 Mbps"] }
    S-03: { usd_mbps_mes: [8, "US$ 8 por Mbps-mes"] }
    S-04: { bhr: [0.30, "30 %"] }
    S-05: { tb_mes: [19.4, "19,4 TB"] }
    S-06: { ciclos_anio: [2, "2 por PC"] }
    S-07: { horas_pc_ciclo: [0.25, "0,25 h"], tarifa_usd_h: [5, "US$ 5/h"] }
    S-08: { servidor_usd: [3800, "US$ 3 800"] }
    S-09: { usd_kwh: [0.15, "US$ 0,15 por kWh"] }
    S-10: { cok: [0.12, "12 % anual"] }
    S-26: { laboratorios: [10, "10 laboratorios"], pcs_lab: [40, "40 PCs"] }
    S-27: { gb_pc: [3, "3 GB por PC"] }
    S-37: { switch_usd: [600, "US$ 600"] }
    S-38: { ups_usd: [700, "US$ 700"] }
    S-39: { cableado_usd: [200, "US$ 200"] }
    S-40: {}                                   # fórmula: S-04 × S-02 (sin cifra propia)
    S-41: { mant_fraccion: [0.10, "10 %"] }
    # CI-104 (E4): parámetros del modelado AS-IS / TO-BE. Las duraciones de S-43 viven en gestion/e4/simulacion.yaml.
    S-42: { mbps_disponible: [150, "150 Mbps"] }
    S-43: {}
    S-44: { p_interrupcion: [0.30, "30 % de las actualizaciones masivas se interrumpen"], fraccion_pendiente: [0.5, "la mitad pendiente"],
            p_mismo_dia: [0.40, "40 % de los pedidos de preparación llegan el mismo día"], margen_min_h: [0.5, "de 0,5 a 2 h"],
            margen_moda_h: [1, "moda 1 h"], margen_max_h: [2, "de 0,5 a 2 h"], anticipacion_h: [24, "24 h de anticipación"],
            p_cambio: [0.50, "50 % de los pedidos requiere una fuente nueva"], p_descifrar: [0.20, "20 % de las fuentes nuevas requiere descifrar"] }
    S-45: { pedidos_semana: [2, "2 pedidos por laboratorio por semana lectiva"], semanas_anio: [32, "32 semanas lectivas al año"] }

# --------------------------------------------------------------------------------------------------------------------
# Modelo económico base (P2 lo amplía con Monte Carlo). Cada partida nombra el supuesto o la referencia de donde sale.
# --------------------------------------------------------------------------------------------------------------------
economia:
  horizonte_anios: 3
  horas_anio: 8760
  capex:
    - { id: CX-1, concepto: "Servidor físico ESX01 (12 núcleos, 96 GB)", de: "S-08.servidor_usd" }
    - { id: CX-2, concepto: "Switch núcleo L2 con 10 GbE (SW-CORE01)",   de: "S-37.switch_usd" }
    - { id: CX-3, concepto: "UPS online 1,5 kVA (UPS01)",                de: "S-38.ups_usd" }
    - { id: CX-4, concepto: "Cableado y accesorios del gabinete",        de: "S-39.cableado_usd" }
  opex:
    - { id: OX-1, tipo: operacion,     concepto: "AWS 24×7: suma de C1–C7 × 12", formula: "suma(aws_lineas) × 12" }
    - { id: OX-2, tipo: operacion,     concepto: "Energía del rack",             formula: "consumo_w × horas_anio / 1000 × S-09.usd_kwh" }
    - { id: OX-3, tipo: mantenimiento, concepto: "Mantenimiento del hardware",   formula: "S-41.mant_fraccion × capex_total" }
  beneficios:
    - { id: BN-1, concepto: "Mbps de ampliación diferidos", formula: "S-04.bhr × S-02.enlace_mbps × S-03.usd_mbps_mes × 12", supuesto: S-40 }
    - { id: BN-2, concepto: "Horas técnicas ahorradas",     formula: "S-01.pcs × S-06.ciclos_anio × S-07.horas_pc_ciclo × S-07.tarifa_usd_h" }
  descuento: "S-10.cok"

# --------------------------------------------------------------------------------------------------------------------
# Datos propios de CE01 (fuente: guía CE01 v0.4). Las evaluaciones 1–5 son juicio del equipo, no supuestos medibles:
# llevan `fuente` en lugar de S-xx y se validan con la DTI (AHP en P2).
# --------------------------------------------------------------------------------------------------------------------
criterios:
  fuente: "Guía CE01 v0.4 B2.2 (punto de partida; P2 los deriva con AHP)"
  lista:
    - { id: C1, nombre: "Eficacia contra descargas repetidas (incluido HTTPS)", peso: 0.25 }
    - { id: C2, nombre: "Seguridad y privacidad",                               peso: 0.20 }
    - { id: C3, nombre: "TCO a 3 años",                                         peso: 0.20 }
    - { id: C4, nombre: "Autonomía del encargado (facilidad de gestión)",       peso: 0.15 }
    - { id: C5, nombre: "Soporte y mantenibilidad",                             peso: 0.10 }
    - { id: C6, nombre: "Valor académico",                                      peso: 0.10 }

alternativas:
  fuente: "Guía CE01 v0.4 B2.2 (puntajes 1–5 por criterio C1…C6)"
  lista:
    - { id: A0, nombre: "Ampliar el ancho de banda",                                      puntajes: [2, 3, 1, 3, 5, 1] }
    - { id: A1, nombre: "Squid + SSL-Bump",                                               puntajes: [4, 3, 4, 2, 4, 2] }
    - { id: A2, nombre: "LanCache (solo HTTP / juegos y actualizaciones)",                puntajes: [2, 4, 5, 2, 3, 2] }
    - { id: A3, nombre: "Servidor de actualizaciones del fabricante (WSUS / Delivery Optimization)", puntajes: [3, 4, 4, 2, 4, 1] }
    - { id: A4, nombre: "Celeris Edge",                                                   puntajes: [4, 5, 4, 5, 2, 5] }
    - { id: A5, nombre: "Caché web del FortiGate existente (si el modelo la tiene)",      puntajes: [3, 3, 4, 1, 4, 1] }

riesgos_estrategicos:
  fuente: "Guía CE01 v0.4 B1.8 (escala 1–5; puntaje = P × I); dueño propuesto por el equipo según el reparto de 00 M9 (CI-101)"
  lista:
    - { id: RE-01, riesgo: "El proyecto depende de dos personas", p: 4, i: 5, respuesta: "Documentación como código, runbooks, transferencia a la DTI", disparador: "Un integrante ausente 2 semanas", dueno: Ambos }
    - { id: RE-02, riesgo: "Rechazo por privacidad de la CA", p: 3, i: 5, respuesta: "Solo PCs institucionales, portal previo al uso, CA limitada", disparador: "Quejas formales", dueno: Nick }
    - { id: RE-03, riesgo: "Más tráfico cifrado reduce lo cacheable", p: 4, i: 3, respuesta: "Proxy explícito, medir BHR mensual, priorizar fuentes HTTP", disparador: "BHR < 15 % tres meses", dueno: Henyelrey }
    - { id: RE-04, riesgo: "Compromiso de la llave de la CA", p: 2, i: 5, respuesta: "Raíz offline, intermedia por nodo, Name Constraints", disparador: "Alerta de integridad", dueno: Nick }
    - { id: RE-05, riesgo: "La DTI no aprueba el despliegue", p: 3, i: 4, respuesta: "Piloto en un laboratorio, demostración previa en laboratorio emulado", disparador: "Respuesta negativa", dueno: Henyelrey }
    - { id: RE-06, riesgo: "Los encargados no adoptan la consola", p: 3, i: 4, respuesta: "Validación del prototipo con encargados (CE02 C2.2), capacitación corta", disparador: "Menos de 1 uso semanal", dueno: Nick }
    - { id: RE-07, riesgo: "Costos AWS fuera de presupuesto", p: 2, i: 3, respuesta: "AWS Budgets, entorno de laboratorio efímero", disparador: "Gasto > 80 % del mes", dueno: Nick }
    - { id: RE-08, riesgo: "Software con certificate pinning falla", p: 4, i: 2, respuesta: "Nunca descifrar por defecto; lista de compatibilidad", disparador: "Ticket de soporte", dueno: Nick }
    - { id: RE-09, riesgo: "No hay servidor físico disponible", p: 3, i: 4, respuesta: "Laboratorio emulado y AWS efímero para las pruebas de S2", disparador: "Sin respuesta de la DTI", dueno: Nick }
    - { id: RE-10, riesgo: "Cambio de licenciamiento del hipervisor", p: 3, i: 3, respuesta: "Diseño agnóstico; Proxmox como equivalente", disparador: "Aviso del fabricante", dueno: Nick }
    - { id: RE-11, riesgo: "La DTI no habilita en el FortiGate el NAT 1:1 (VPN, portal) o la exclusión de inspección SSL del nodo [S-29]", p: 3, i: 4, respuesta: "Pedido mínimo y documentado; alternativa: VPN de acceso remoto en OPNsense y portal solo interno; demostrar en Modo A", disparador: "Respuesta negativa de la DTI", dueno: Henyelrey }
    - { id: RE-12, riesgo: "Compromiso del acceso remoto al panel (EC2-GW)", p: 2, i: 5, respuesta: "Segundo factor, acciones críticas solo desde el campus, EC2-GW sin datos y recreable, WAF y límite de intentos", disparador: "Alerta de fuerza bruta o de WAF", dueno: Nick }

riesgos_proyecto:
  fuente: "Guía CE01 v0.4 B3.6 (escala 1–5); causa, efecto, estrategia, contingencia, disparador y estado agregados en P3; RP-08…RP-10 nuevos (CI-103)"
  lista:
    - { id: RP-01, riesgo: "Retraso en el levantamiento con la DTI o los encargados", p: 3, i: 4, respuesta: "Supuestos marcados, validación posterior", dueno: Henyelrey,
        causa: "La DTI y los encargados tienen agenda propia y el proyecto no tiene prioridad institucional", efecto: "E1, E2 y E4 se presentan con supuestos sin validar y la ruta crítica de S1 se desplaza",
        estrategia: Mitigar, contingencia: "Presentar con los supuestos marcados y validar en S2 (00 M5)", disparador: "Reunión con la DTI sin fecha confirmada al cierre de la semana 2", estado: Abierto }
    - { id: RP-02, riesgo: "Sobrecarga académica en exámenes", p: 4, i: 3, respuesta: "Adelantar el trabajo de la ruta crítica antes de exámenes; horas adicionales con cargo a la reserva de contingencia", dueno: Ambos,
        causa: "Coinciden exámenes y entregas de otros cursos", efecto: "Una actividad de la ruta crítica se retrasa y la sustentación pierde ensayo",
        estrategia: Mitigar, contingencia: "Redistribuir actividades entre los integrantes y recortar el alcance de la demo, nunca el de los informes", disparador: "SPI menor que 0,9 en el seguimiento semanal", estado: Abierto }
    - { id: RP-03, riesgo: "Datos inconsistentes entre documentos", p: 3, i: 4, respuesta: "Fuente única (00 M4.1) + validador", dueno: Nick,
        causa: "La misma cifra se usa en tres áreas y en varios documentos", efecto: "El jurado detecta contradicciones y la evidencia pierde valor",
        estrategia: Mitigar, contingencia: "Corregir en infra/*.yaml o gestion/ce01.yaml y regenerar; registrar el CI-xx", disparador: "make validate en rojo", estado: Abierto }
    - { id: RP-04, riesgo: "Secretos en el repositorio", p: 2, i: 5, respuesta: "gitleaks en pre-commit y CI", dueno: Nick,
        causa: "Llaves de laboratorio, tokens o credenciales de AWS copiados por error", efecto: "Exposición de la cuenta y del laboratorio; incumplimiento de las reglas del proyecto",
        estrategia: Evitar, contingencia: "Revocar y rotar la credencial y limpiar el historial", disparador: "Alerta de gitleaks en el CI", estado: Abierto }
    - { id: RP-05, riesgo: "Falla de la demo en la sustentación", p: 2, i: 4, respuesta: "Laboratorio emulado sin red + video de respaldo", dueno: Ambos,
        causa: "Dependencia de la red del aula o de servicios externos", efecto: "La defensa técnica pierde la evidencia en vivo",
        estrategia: Mitigar, contingencia: "Reproducir la demo grabada (paquete 6.2)", disparador: "Falla en un ensayo de sustentación", estado: Abierto }
    - { id: RP-06, riesgo: "Recursos AWS olvidados encendidos", p: 3, i: 2, respuesta: "destroy en el runbook, alarma de Budgets", dueno: Nick,
        causa: "Pruebas del Modo A interrumpidas sin destruir el entorno", efecto: "Costo no presupuestado y consumo del crédito de la cuenta",
        estrategia: Mitigar, contingencia: "Ejecutar tofu destroy y revisar la factura", disparador: "Alarma de AWS Budgets al 80 % del presupuesto", estado: Abierto }
    - { id: RP-07, riesgo: "Ramas sin fusionar y choque de IDs entre documentos y repositorio", p: 4, i: 3, respuesta: "Fusionar en main primero; los IDs nuevos se piden en CAMBIOS-INVENTARIO.md; manda el repositorio", dueno: Ambos,
        causa: "Trabajo en paralelo de dos personas en ramas largas", efecto: "Conflictos de fusión, IDs reutilizados y retrabajo",
        estrategia: Mitigar, contingencia: "Resolver el conflicto en una rama de integración y regenerar los artefactos", disparador: "Pull request abierto más de tres días o conflicto al fusionar", estado: Abierto }
    - { id: RP-08, riesgo: "Calendario académico distinto del previsto en el plan", p: 3, i: 3, respuesta: "Fechas marcadas para confirmar; el cronograma se recalcula desde gestion/e3/datos/plan.yaml", dueno: Henyelrey,
        causa: "Las fechas de entrega de S1 y del semestre 2027-I no están publicadas", efecto: "La ruta crítica se acorta o se desplaza y se pierde holgura",
        estrategia: Aceptar, contingencia: "Reprogramar desde el modelo; la ruta crítica indica qué actividades comprimir", disparador: "Publicación del calendario académico", estado: Abierto }
    - { id: RP-09, riesgo: "Retraso en la compra del hardware del piloto", p: 3, i: 4, respuesta: "Solicitar la compra apenas la DTI apruebe el piloto; la adquisición tiene holgura frente a la construcción de la consola", dueno: Nick,
        causa: "Plazos del proceso de compras de la universidad", efecto: "El despliegue del piloto se retrasa y la ampliación sale del semestre",
        estrategia: Mitigar, contingencia: "Piloto sobre un servidor prestado por la DTI o sobre el laboratorio emulado", disparador: "Orden de compra no emitida al cierre de la segunda semana de S2", estado: Abierto }
    - { id: RP-10, riesgo: "Encargados no disponibles para validar el prototipo y el piloto", p: 3, i: 3, respuesta: "Agendar las sesiones con la DTI al inicio de cada etapa", dueno: Henyelrey,
        causa: "Carga operativa de los encargados durante el ciclo académico", efecto: "El prototipo y la consola no se validan con usuarios reales (SUS sin medir)",
        estrategia: Mitigar, contingencia: "Validar con docentes usuarios y repetir con encargados en S2", disparador: "Menos de dos encargados confirmados una semana antes de la sesión", estado: Abierto }

procesos:
  fuente: "Guía CE01 v0.4 B4.1"
  lista:
    - { id: P1, nombre: "Actualización masiva de las PCs de un laboratorio", por_que: "Es la descarga repetida de mayor volumen", dueno: "Encargado / DTI Soporte" }
    - { id: P2, nombre: "Preparación de un laboratorio para una clase (el docente pide software o material)", por_que: "Es donde se pierde tiempo de clase y donde el encargado necesita autonomía", dueno: "Encargado de laboratorio" }

edt:
  fuente: "Guía CE01 v0.4 B3.3 (paquetes) y diccionario (extracto); P3 completa la descripción y el criterio de aceptación de cada paquete y agrega 5.4–5.6 para S2 (CI-103). Las actividades (nivel 3), duraciones y costos viven en gestion/e3/datos/plan.yaml"
  paquetes:
    - { id: "0", nombre: "Celeris Edge EPE" }
    - { id: "1", nombre: "Gestión del proyecto" }
    - { id: "1.1", nombre: "Acta", descripcion: "Acta de constitución firmada por el sponsor", aceptacion: "Acta con OB-1…OB-5, alcance, exclusiones, restricciones, supuestos, hitos, presupuesto y firmas del sponsor, del director y del líder técnico", responsable: Henyelrey }
    - { id: "1.2", nombre: "Plan", descripcion: "Plan de gestión aprobado con línea base de alcance, cronograma y costos", aceptacion: "Línea base registrada en el XML de MS Project y en el libro EVM; aprobada por el sponsor", responsable: Henyelrey }
    - { id: "1.3", nombre: "Seguimiento", descripcion: "Reunión semanal, control EVM y revisión de riesgos y cambios", aceptacion: "Acta semanal con CPI, SPI, riesgos revisados y solicitudes de cambio registradas como issues", responsable: Henyelrey }
    - { id: "1.4", nombre: "Lecciones aprendidas", descripcion: "Registro de lecciones aprendidas y cierre administrativo", aceptacion: "Plantilla de lecciones completa y archivo del proyecto entregado a la DTI", responsable: Henyelrey }
    - { id: "2", nombre: "Gestión de TI" }
    - { id: "2.1", nombre: "Diagnóstico", descripcion: "Informe E1 con los datos levantados con la DTI", aceptacion: "Contenido mínimo del EPE completo, chequeos a)–f) en verde y entrevista COBIT realizada", responsable: Henyelrey }
    - { id: "2.2", nombre: "Business case", descripcion: "Informe E2 y modelo económico con fórmulas vivas", aceptacion: "VAN del XLSX igual al de Python, AHP consistente y cotización del ISP incorporada", responsable: Henyelrey }
    - { id: "2.3", nombre: "Plan de gestión", descripcion: "Informe E3, cronograma en XML de MS Project, presupuesto con EVM y backlog", aceptacion: "Ruta crítica de Python igual a la de MS Project y presupuesto por paquete igual a la línea base", responsable: Henyelrey }
    - { id: "2.4", nombre: "AS-IS / TO-BE", descripcion: "Informe E4 con los procesos P1 y P2 en BPMN y sus mediciones", aceptacion: "BPMN AS-IS y TO-BE de P1 y P2 y al menos 30 observaciones cronometradas", responsable: Henyelrey }
    - { id: "3", nombre: "Ingeniería de software" }
    - { id: "3.1", nombre: "SRS", descripcion: "Especificación de requisitos y casos de uso de la consola y del nodo", aceptacion: "Plantilla oficial de CE02 completa y cada REQ-F asociado a un caso de uso", responsable: Nick }
    - { id: "3.2", nombre: "Prototipo de la consola validado", descripcion: "Prototipo navegable de la consola y su validación con encargados", aceptacion: "10 pantallas (CE02 C2.1), validadas con ≥ 2 encargados, SUS ≥ 75", responsable: Nick, esfuerzo_h: 20 }
    - { id: "3.3", nombre: "C4 + ADR", descripcion: "Modelo C4 y registro de decisiones de arquitectura", aceptacion: "Cada contenedor del C4 existe en infra/inventory.yaml y cada decisión tiene su ADR", responsable: Nick }
    - { id: "3.4", nombre: "UML", descripcion: "Diagramas UML de los casos de uso", aceptacion: "Un diagrama de secuencia por caso de uso, generado desde PlantUML", responsable: Nick }
    - { id: "3.5", nombre: "Trazabilidad", descripcion: "Matriz requisito, caso de uso y prueba", aceptacion: "Ningún requisito sin caso de uso ni prueba asociada", responsable: Nick }
    - { id: "4", nombre: "Infraestructura" }
