# gestion/e1/datos/diagnostico.yaml — Contenido cualitativo del Entregable 1 (CE01): una sola fuente para las tablas del
# informe (gestion/e1/tablas.py), las figuras (gestion/e1/figuras/generar.py) y el XLSX de matrices.
#
# Regla de evidencia: cada fila lleva `fuente`. Valores posibles:
#   - un supuesto [S-xx] de infra/trazabilidad.yaml, una sección del Marco común (00 Mx) o de la guía CE01 (B1.x);
#   - «[levantar con la DTI]» o «[confirmar con el plan estratégico]» cuando el dato es institucional y no se tiene;
#   - «Valoración del equipo» cuando es juicio del equipo (intensidad, impacto, frecuencia): se valida en la entrevista.
# Las cifras no se escriben aquí: las tablas las leen de ce01_datos.py o de infra/*.yaml.

pendiente: "[levantar con la DTI]"
pendiente_pe: "[confirmar con el plan estratégico]"

# ------------------------------------------------------------------------------------------------ 1.1 Contexto
porter:
  fuente: "Porter [2], adaptado a una universidad privada del altiplano; intensidad = valoración del equipo"
  fuerzas:
    - fuerza: "Poder de negociación de los proveedores de conectividad"
      intensidad: Alta
      hecho: "Un solo enlace de 300 Mbps con IP fija [S-02, S-15]; cada Mbps adicional cuesta US$ 8 por mes [S-03] y la oferta del altiplano es menor que la de la costa (guía CE01 B1.2)"
      fuente: "[S-02], [S-03], [S-15]; número de ISP con fibra en Juliaca [levantar con la DTI]"
    - fuerza: "Amenaza de sustitutos"
      intensidad: Alta
      hecho: "Ampliar el enlace, un servidor de actualizaciones del fabricante, LanCache o la caché web del FortiGate resuelven parte del problema sin un proyecto nuevo"
      fuente: "Alternativas A0–A5 de gestion/ce01.yaml (se evalúan en el E2)"
    - fuerza: "Poder de negociación de los estudiantes"
      intensidad: Media
      hecho: "Hasta 400 personas usan los laboratorios a la vez [S-36] y además traen su equipo al Wi-Fi; esperan velocidad y que su equipo no se inspeccione"
      fuente: "[S-36]; 00 M3.3"
    - fuerza: "Rivalidad entre universidades de la región"
      intensidad: Media
      hecho: "La calidad visible de los laboratorios (que el software esté listo al empezar la clase) es un atributo de la oferta académica en ingeniería"
      fuente: "Universidades que compiten en Juliaca y Puno y su oferta de laboratorios [levantar con la DTI y Admisión]"
    - fuerza: "Amenaza de nuevos entrantes"
      intensidad: Baja
      hecho: "Abrir una universidad con laboratorios exige licenciamiento e inversión en infraestructura; los programas a distancia compiten sin laboratorios presenciales"
      fuente: "Valoración del equipo [levantar con Admisión]"

conectividad:
  fuente: "[S-02], [S-03], [S-15]; guía CE01 v0.4 B1.2. Ninguna cifra de la costa se inventa"
  filas:
    - aspecto: "Ancho de banda contratado"
      altiplano: "300 Mbps simétricos [S-02]"
      costa: "No aplica (el campus Juliaca no contrata en la costa)"
    - aspecto: "Costo de 1 Mbps adicional"
      altiplano: "US$ 8 por Mbps-mes [S-03]"
      costa: "Cotización de referencia de un ISP de Lima [levantar con la DTI]"
    - aspecto: "IP pública fija"
      altiplano: "1 IP estática en el firewall perimetral [S-15]"
      costa: "—"
    - aspecto: "Proveedores con fibra disponibles"
      altiplano: "[levantar con la DTI]"
      costa: "[levantar con la DTI]"
    - aspecto: "Plazo para ampliar el enlace"
      altiplano: "[levantar con la DTI] (contrato vigente)"
      costa: "—"

organigrama:
  fuente: "Guía CE01 v0.4 B1.2; dependencia exacta [levantar con la DTI]"
  unidades:
    - { id: dir,  nombre: "Dirección del campus Juliaca", padre: null, toca: false }
    - { id: fac,  nombre: "Facultades", padre: dir, toca: false }
    - { id: ep,   nombre: "EP Ingeniería de Sistemas (equipo del proyecto)", padre: fac, toca: true, rol: "Diseña y valida" }
    - { id: dti,  nombre: "Dirección de Tecnologías de Información (DTI)", padre: dir, toca: true, rol: "Aprueba y opera" }
    - { id: inf,  nombre: "Infraestructura", padre: dti, toca: true, rol: "FortiGate, enlace, servidores" }
    - { id: sop,  nombre: "Soporte", padre: dti, toca: true, rol: "PCs e imágenes de laboratorio" }
    - { id: sis,  nombre: "Sistemas", padre: dti, toca: false }
    - { id: enc,  nombre: "Encargados de laboratorio (10)", padre: sop, toca: true, rol: "Usuarios de la consola", dudoso: true }
    - { id: odp,  nombre: "Oficial de datos personales", padre: dir, toca: true, rol: "Ley 29733", dudoso: true }
  nota: "Los encargados dependen de Soporte o de la facultad, y el oficial de datos personales puede estar en otra unidad: [levantar con la DTI]"

cadena_valor:
  fuente: "Porter [1], adaptado; dependencia: guía CE01 v0.4 B1.2"
  actividades:
    - { tipo: Primaria, actividad: "Enseñanza en laboratorios", dependencia: Alta, por_que: "Software de cada curso, actualizaciones y plataforma virtual se descargan en las PCs del laboratorio", problema: "La clase empieza tarde si la descarga no terminó" }
    - { tipo: Primaria, actividad: "Investigación", dependencia: Media, por_que: "Datasets, bibliotecas y modelos que se descargan en los laboratorios", problema: "Descargas largas compiten con las clases" }
    - { tipo: Primaria, actividad: "Admisión y extensión", dependencia: Baja, por_que: "Usa sistemas web, no los laboratorios", problema: "Sufre la saturación del enlace, no la causa" }
    - { tipo: Apoyo, actividad: "Infraestructura de TI y soporte", dependencia: Alta, por_que: "Prepara y mantiene los laboratorios, PC por PC", problema: "Horas técnicas en cada ciclo de actualización" }
    - { tipo: Apoyo, actividad: "Gestión administrativa y financiera", dependencia: Baja, por_que: "Paga el enlace", problema: "Costo de ampliar el enlace cada año" }

stakeholders:
  fuente: "Guía CE01 v0.4 B1.2 (poder × interés de Mendelow [3]); niveles = valoración del equipo"
  lista:
    - { nombre: "Encargados de laboratorio", poder: Medio, interes: Alto, estrategia: "Gestionar de cerca", espera: "Laboratorios listos a tiempo, sin depender de otros" }
    - { nombre: "DTI", poder: Alto, interes: Alto, estrategia: "Gestionar de cerca", espera: "Menos saturación del enlace, control y seguridad" }
    - { nombre: "Docentes", poder: Medio, interes: Alto, estrategia: "Mantener informados", espera: "Clases sin esperas por descargas" }
    - { nombre: "Estudiantes (PC y BYOD)", poder: Bajo, interes: Alto, estrategia: "Mantener informados", espera: "Velocidad y privacidad; en BYOD, que su equipo no se inspeccione" }
    - { nombre: "Dirección del campus", poder: Alto, interes: Medio, estrategia: "Mantener satisfecha", espera: "Ahorro e imagen" }
    - { nombre: "Oficial de datos personales", poder: Medio, interes: Medio, estrategia: "Consultar", espera: "Cumplimiento de la Ley 29733" }
    - { nombre: "ISP", poder: Medio, interes: Bajo, estrategia: "Monitorear", espera: "Contrato dentro de términos" }
    - { nombre: "AWS", poder: Bajo, interes: Bajo, estrategia: "Monitorear", espera: "Uso dentro de los términos de la cuenta" }
    - { nombre: "Jurado EPE", poder: Alto, interes: Alto, estrategia: "Gestionar de cerca", espera: "Evidencia, coherencia, dominio técnico" }

# ------------------------------------------------------------------------------------------------ 1.2 Estratégico
identidad:
  fuente: "Plan estratégico institucional de la UPeU vigente [confirmar con el plan estratégico]"
  mision: "[confirmar con el plan estratégico: texto oficial de la misión]"
  vision: "[confirmar con el plan estratégico: texto oficial de la visión]"
  objetivos:
    - { id: OE-a, texto: "Fortalecer la infraestructura tecnológica para la enseñanza (ejemplo de la guía B1.3)", estado: "[confirmar con el plan estratégico]", ob: [OB-1, OB-2] }
    - { id: OE-b, texto: "Calidad académica: laboratorios listos para cada clase", estado: "[confirmar con el plan estratégico]", ob: [OB-2, OB-3] }
    - { id: OE-c, texto: "Gestión eficiente de los recursos", estado: "[confirmar con el plan estratégico]", ob: [OB-1, OB-3] }
    - { id: OE-d, texto: "Seguridad de la información y cumplimiento", estado: "[confirmar con el plan estratégico]", ob: [OB-4, OB-5] }
  nota: "OE-a…OE-d son rótulos de trabajo, no IDs del contrato M6: se reemplazan por los códigos oficiales del plan estratégico cuando la DTI lo entregue"

mapa_estrategico:
  fuente: "Kaplan y Norton [4], adaptado; objetivos OB-x de infra/trazabilidad.yaml"
  perspectivas:
    - nombre: "Institucional (resultado)"
      objetivos:
        - { id: m1, texto: "Diferir la ampliación del enlace", ob: OB-1 }
        - { id: m2, texto: "Imagen de laboratorios confiables", ob: OB-2 }
    - nombre: "Usuarios (estudiantes y docentes)"
      objetivos:
        - { id: m3, texto: "Clases sin esperas por descargas", ob: OB-2 }
        - { id: m4, texto: "Saber qué se descifra y qué no", ob: OB-4 }
    - nombre: "Procesos internos"
      objetivos:
        - { id: m5, texto: "Descargar una vez, servir muchas", ob: OB-1 }
        - { id: m6, texto: "Preparar el laboratorio con precarga", ob: OB-2 }
        - { id: m7, texto: "El encargado decide qué se cachea y quién accede", ob: OB-3 }
        - { id: m8, texto: "Detectar el abuso del servicio", ob: OB-5 }
    - nombre: "Aprendizaje y crecimiento"
      objetivos:
        - { id: m9, texto: "Medir el desperdicio por laboratorio", ob: OB-1 }
        - { id: m10, texto: "DTI y encargados operan sin el equipo autor", ob: OB-3 }
  enlaces: [[m9, m5], [m10, m7], [m10, m6], [m5, m1], [m5, m3], [m6, m3], [m7, m6], [m8, m4], [m3, m2], [m4, m2]]

foda:
  fuente: "Guía CE01 v0.4 B1.3 (a validar con la DTI y los encargados)"
  F:
    - { id: F1, texto: "PCs de laboratorio administradas centralmente (imagen y políticas)", fuente: "[levantar con la DTI]" }
    - { id: F2, texto: "Encargados que conocen qué software pide cada curso", fuente: "00 M3.3" }
    - { id: F3, texto: "Línea académica de infraestructura y seguridad en la EP", fuente: "Plan de estudios de la EP" }
  O:
    - { id: O1, texto: "Herramientas libres maduras (OPNsense, Suricata, Wazuh)", fuente: "Arquitectura v0.4" }
    - { id: O2, texto: "ESXi gratuito de nuevo desde abril de 2025", fuente: "Broadcom [12]" }
    - { id: O3, texto: "Créditos de AWS para estudiantes y emuladores locales gratuitos", fuente: "[S-13]" }
    - { id: O4, texto: "El FortiGate existente se reutiliza: el proyecto se apoya en él en lugar de reemplazarlo", fuente: "D-26; [S-29]" }
  D:
    - { id: D1, texto: "Enlace limitado y caro", fuente: "[S-02], [S-03]" }
    - { id: D2, texto: "Descargas repetidas en cada PC (40 por laboratorio)", fuente: "[S-26], [S-27]" }
    - { id: D3, texto: "Preparación manual, PC por PC", fuente: "[S-07]; [levantar con la DTI]" }
    - { id: D4, texto: "Sin medición del desperdicio de ancho de banda", fuente: "00 M2.3 (línea base «A medir»)" }
  A:
    - { id: A1, texto: "Más tráfico cifrado (HTTPS, QUIC, ECH) reduce lo que se puede cachear", fuente: "RFC 9849; RFC 9000" }
    - { id: A2, texto: "Cambios de licenciamiento de proveedores (hipervisor)", fuente: "RE-10" }
    - { id: A3, texto: "Exigencias del reglamento de datos personales", fuente: "D.S. 016-2024-JUS" }
    - { id: A4, texto: "Uso de IA y búsqueda de respuestas en exámenes por la red del campus (fuera de S1)", fuente: "00 M2.4" }

tows:
  fuente: "Elaboración propia a partir del FODA; decisiones D-xx de infra/trazabilidad.yaml"
  estrategias:
    - { tipo: FO, id: FO-1, cruza: "F1, O2, O4", estrategia: "Instalar la caché detrás del FortiGate existente sobre ESXi gratuito y repartir el PAC con las políticas centrales de las PCs", apunta_a: "D-26, D-05" }
    - { tipo: FO, id: FO-2, cruza: "F2, O1", estrategia: "Que el encargado arme el catálogo de contenido del curso; la DTI solo aprueba lo que se descifra", apunta_a: "D-20" }
    - { tipo: FO, id: FO-3, cruza: "F3, O3", estrategia: "Probar todo en un laboratorio emulado y en AWS efímero antes de tocar el campus", apunta_a: "D-18" }
    - { tipo: FA, id: FA-1, cruza: "F1, A1", estrategia: "Proxy explícito por URL fija del PAC y bloqueo de QUIC en las PCs institucionales para conservar lo cacheable", apunta_a: "D-05, D-06" }
    - { tipo: FA, id: FA-2, cruza: "F1, A3", estrategia: "Descifrar solo en PCs institucionales con aviso previo; el BYOD nunca se descifra", apunta_a: "D-27, D-15, D-04" }
    - { tipo: FA, id: FA-3, cruza: "F3, A2", estrategia: "Diseño independiente del hipervisor: la misma imagen corre en ESXi, en Proxmox o en el laboratorio emulado", apunta_a: "D-18 (RE-10)" }
    - { tipo: DO, id: DO-1, cruza: "D2, O4", estrategia: "Usar primero lo que ya existe: la caché web del FortiGate (si el modelo la tiene) y un servidor de actualizaciones del fabricante para Windows. Celeris cubre lo que ellos no: instaladores de cursos, paquetes y fuentes HTTPS aprobadas", apunta_a: "Alternativas A3 y A5 (E2)" }
    - { tipo: DO, id: DO-2, cruza: "D3, O1", estrategia: "Precargar el contenido de la clase en el nodo fuera del horario de clase", apunta_a: "D-21" }
    - { tipo: DO, id: DO-3, cruza: "D4, O1", estrategia: "Medir el ahorro por laboratorio con métricas del nodo, nunca por persona", apunta_a: "D-22" }
    - { tipo: DA, id: DA-1, cruza: "D1, A1", estrategia: "Revisar el BHR cada mes y ampliar el enlace solo si la caché deja de rendir", apunta_a: "RE-03; alternativa A0 (E2)" }
    - { tipo: DA, id: DA-2, cruza: "D1, A4", estrategia: "Segmentar: el Wi-Fi y los laboratorios no alcanzan los servidores del proyecto; base del futuro modo examen", apunta_a: "D-16, D-17" }

pestel:
  fuente: "Normas y hechos citados por fila"
  factores:
    - { factor: Político, hecho: "Las decisiones sobre el FortiGate, el Wi-Fi y la capa de acceso son de la DTI; el proyecto solo pide cambios mínimos", fuente: "00 M3.2; [S-14], [S-28], [S-29]", efecto: "Toda integración pasa por un pedido documentado (RE-11)" }
    - { factor: Económico, hecho: "Costo por Mbps del altiplano mayor que en la costa", fuente: "[S-03]", efecto: "Base del beneficio económico (BN-1 del E2)" }
    - { factor: Social, hecho: "Estudiantes con equipo propio en el Wi-Fi esperan privacidad", fuente: "00 M3.1; [S-28]", efecto: "BYOD sin descifrado y proxy opcional (D-27)" }
    - { factor: Tecnológico, hecho: "ECH (RFC 9849) y HTTP/3 sobre QUIC (RFC 9000, RFC 9114) ocultan o saltan lo que una caché clásica ve", fuente: "RFC 9849 [9]; RFC 9114 [10]", efecto: "Proxy explícito y bloqueo de UDP/443 en laboratorios (D-05, D-06)" }
    - { factor: Tecnológico, hecho: "ESXi vuelve a tener edición gratuita desde abril de 2025", fuente: "Broadcom [12]", efecto: "El host no paga licencia de hipervisor (O2)" }
    - { factor: Ecológico, hecho: "Menos tráfico repetido es menos energía de red; el rack del proyecto agrega consumo propio", fuente: "infra/centro_datos.yaml (energía); [S-09]", efecto: "Indicador complementario; el consumo entra al OPEX del E2" }
    - { factor: Legal, hecho: "Reglamento de la Ley 29733 (D.S. 016-2024-JUS), vigente desde marzo de 2025", fuente: "Ley 29733 [7]; D.S. 016-2024-JUS [8]", efecto: "Aviso previo, minimización y evaluación de impacto antes del piloto (OB-4)" }

fce:
  fuente: "Guía CE01 v0.4 B1.3; metas de infra/trazabilidad.yaml → objetivos_proyecto (CI-101)"
  lista:
    - { id: FCE-1, factor: "Apoyo de la DTI", kpi: "Pedidos mínimos al FortiGate atendidos (NAT 1:1 y exclusión de inspección SSL)", meta: "Todos antes del piloto [S-29]", medicion: "Acta de reunión con la DTI", riesgo: RE-11 }
    - { id: FCE-2, factor: "Los encargados usan la consola", kpi: "Usos semanales de la consola por encargado", meta: "Al menos uno por semana (disparador de RE-06)", medicion: "Auditoría de la consola (CTRL01)", riesgo: RE-06 }
    - { id: FCE-3, factor: "La caché rinde", kpi: "BHR mensual por laboratorio", meta_ob: OB-1, medicion: "Métricas del nodo (REQ-F-13, REQ-F-25)", riesgo: RE-03 }
    - { id: FCE-4, factor: "Cero incidentes de privacidad", kpi: "PCs con aviso entregado antes de instalar la CA", meta_ob: OB-4, medicion: "Portal de transparencia y registro de instalación de la CA", riesgo: RE-02 }
    - { id: FCE-5, factor: "Operación por personal distinto del equipo autor", kpi: "Runbooks ejecutados por la DTI sin ayuda del equipo", meta: "Ensayo completo en S2", medicion: "Ensayo cronometrado con la DTI", riesgo: RE-01 }

