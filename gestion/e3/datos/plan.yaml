  - { id: "5.4.1", paquete: "5.4", nombre: "Sprints 1–2: autenticación, auditoría y catálogo", dur: 10, pred: [HS2], horas: { Nick: 40, Henyelrey: 10 }, sprints: [1, 2] }
  - { id: "5.4.2", paquete: "5.4", nombre: "Sprints 3–4: laboratorios, configuración firmada y precargas", dur: 10, pred: ["5.4.1"], horas: { Nick: 40, Henyelrey: 10 }, sprints: [3, 4] }
  - { id: "5.4.3", paquete: "5.4", nombre: "Sprints 5–6: ahorro, portal y solicitudes", dur: 10, pred: ["5.4.2"], horas: { Nick: 40, Henyelrey: 10 }, sprints: [5, 6] }
