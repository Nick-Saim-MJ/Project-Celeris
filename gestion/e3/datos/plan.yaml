  - { id: "5.6.1", paquete: "5.6", nombre: "Ampliación a los 10 laboratorios", dur: 10, pred: [H3], horas: { Nick: 16, Henyelrey: 16, DTI: 6, Encargados: 5 } }
  - { id: "1.4.1", paquete: "1.4", nombre: "Lecciones aprendidas y cierre administrativo", dur: 2, pred: ["5.6.1"], horas: { Henyelrey: 3, Nick: 3 } }
