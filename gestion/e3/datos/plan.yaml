  - { id: "5.5.2", paquete: "5.5", nombre: "Despliegue en el laboratorio piloto y simulacro T59", dur: 5, pred: ["5.4.4", "5.1.2"], horas: { Nick: 12, Henyelrey: 8, DTI: 4 },
