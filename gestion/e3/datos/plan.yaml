  - { id: "5.5.3", paquete: "5.5", nombre: "Operación y medición del piloto (BHR, tiempos, SUS)", dur: 20, pred: ["5.5.2"], horas: { Nick: 10, Henyelrey: 10, Encargados: 6 },
