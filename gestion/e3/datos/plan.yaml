  - { id: "6.1.2", paquete: "6.1", nombre: "Ensayos de la sustentación final", dur: 2, pred: ["6.3.2", "6.2.2", "1.4.1"], horas: { Henyelrey: 4, Nick: 4 } }
  - { id: H4, nombre: "Sustentación final y cierre", hito: true, pred: ["6.1.2"] }
