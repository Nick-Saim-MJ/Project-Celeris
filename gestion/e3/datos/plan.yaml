  - { id: "6.1.1", paquete: "6.1", nombre: "Ensayos de la sustentación de S1", dur: 3, pred: ["6.3.1", "6.2.1"], horas: { Henyelrey: 4, Nick: 4 } }
  - { id: H1, nombre: "Sustentación de S1", hito: true, pred: ["6.1.1"] }
  # ------------------------------------------------------------------ S2
  - { id: HS2, nombre: "Inicio de S2", hito: true, pred: [H1], snet: inicio_s2 }
  - { id: "1.3.2", paquete: "1.3", nombre: "Seguimiento semanal de S2", dur: 77, pred: [HS2], horas: { Henyelrey: 16, Nick: 16 } }
  - { id: "5.5.1", paquete: "5.5", nombre: "Aprobación de la DTI y pedidos del FortiGate (S-29)", dur: 5, pred: [HS2], horas: { Henyelrey: 6, DTI: 4 } }
