  regla_3_2_1_1_0:
    copias:
      - { n: 1, que: "Original", donde: "DS-VM (datastore RAID 1)", medio: "SSD en RAID 1", fuera_del_sitio: false, inmutable: false }
      - { n: 2, que: "Copia local de restic dentro de cada VM", donde: "DS-VM (≈ 200 GB)", medio: "SSD en RAID 1", fuera_del_sitio: false, inmutable: false }
      - { n: 3, que: "Copia en S3 celeris-backups", donde: "AWS (S3)", medio: "Almacenamiento de objetos", fuera_del_sitio: true, inmutable: true }
    medios: ["Datastore RAID", "Almacenamiento de objetos"]
    inmutable: { mecanismo: "Object Lock en modo compliance", dias: 30 }
    cero_errores: "Restauración mensual cronometrada sin errores; el simulacro T59 mide el RTO real de la consola."
    por_que_dentro_de_la_vm: "ESXi gratuito no permite VADP: el respaldo corre dentro de cada VM (restic, pgBackRest)."
    limite: "La copia local comparte datastore con el original: protege contra borrado o corrupción dentro de la VM, no contra la pérdida del host; para eso está la copia de S3."
  punto_unico_de_falla:
    elemento: ESX01
    por_que: "Un solo host por presupuesto (D2.2): si cae, caen todas las VM, incluido FW01."
    mitigaciones:
      - "UPS01 con apagado ordenado por NUT en JMP01: evita la corrupción de datastores en un corte eléctrico."
      - "RAID 1 en DS-VM: tolera la falla de un SSD."
      - "VM reconstruibles desde plantillas e IaC; los nodos de caché se recrean desde la imagen OCI (CT-02)."
      - "Respaldo 3-2-1-1-0: la consola se restaura en CTRL01 o en una EC2 temporal (EC2-DR) desde S3 en ≤ 2 h, aun sin el host (CT-03)."
      - "BRK01 e IPMI01 para recuperar FW01 sin ruteo y sin ESXi."
    pendiente: "Segundo host y CARP (H3), fuera del alcance de S1 (D2.2)."
    sin_dato: "El plazo de reposición del servidor físico no está definido en D2.9: no se compromete un RTO del host (CI-86)."
