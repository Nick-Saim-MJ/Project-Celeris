# infra/centro_datos.yaml — FUENTE ÚNICA del centro de datos híbrido (CE0331, Entregable 2)
# Transcripción de docs/celeris/Celeris-CE03-Infraestructura.md (v0.4: D2.3–D2.9) y de docs/celeris/Celeris-Arquitectura-v0.4.md
# (§1, §4, §10, §11). No repite lo que ya define infra/inventory.yaml (IP, VLAN, zonas, flujos, reglas de SG/NACL, rutas): lo
# referencia por ID, y `make validate` (V-90…V-94) comprueba que ambos coinciden. Si no coinciden, manda infra/inventory.yaml.
# La referencia es de este archivo hacia el inventario y no al revés: editar inventory.yaml cambia la huella que el informe de
# CE0311 (cerrado en main) usa para saber si está al día (V-80, V-89); ver CI-85 en docs/infra/e1/CAMBIOS-INVENTARIO.md.
# Todo supuesto lleva [S-xx]. Lo que falta y no se pudo resolver lleva `ci: CI-nn` (registrado en CAMBIOS-INVENTARIO.md).

meta:
  version: "1.0"
  fecha: "2026-11-23"
  entregable: "CE0331 — Análisis y Diseño de Centro de Datos Híbrido (S1, E2)"
  inventario: infra/inventory.yaml
  fuentes: [docs/celeris/Celeris-CE03-Infraestructura.md, docs/celeris/Celeris-Arquitectura-v0.4.md, docs/celeris/Celeris-00-Marco-Comun.md]
  alcance_sin_implementacion: "Solo diseño: no se instala ESXi, no se crea ningún recurso en AWS y no se aplica OpenTofu (CLAUDE.md)"

# ------------------------------------------------------------------------------------------------------------------
# Contexto y reparto campus / nube (D2.1, D2.2, D-19, D-24, D-25; Arquitectura §1)
# ------------------------------------------------------------------------------------------------------------------
contexto:
  problema: "Alojar los nodos de caché, la consola del encargado y la seguridad del servicio con poco presupuesto, dar acceso remoto seguro al panel y no perder la configuración si falla el sitio."
  onpremise: "VMware ESXi 8.0U3e gratuito, un host."
  cloud: "AWS solo para lo que el campus no puede hacer solo: recibir conexiones de Internet al panel sin gastar el enlace del campus (EC2-GW) y guardar respaldos fuera del sitio e inmutables (S3)."
  alcance_incluye: "El host ESXi y sus VM, el almacenamiento local, la VPC, las subredes, EC2, SG, NACL y S3 (D2.2)."
  alcance_excluye:
    - { que: "PCs de usuario", por_que: "Son los usuarios del servicio y existen (PCS-LAB); no se diseñan aquí" }
    - { que: "Alta disponibilidad entre hosts (H3)", por_que: "Un solo host por presupuesto; CARP y un segundo host son hoja de ruta, no diseño de S1" }
    - { que: "FortiGate FGT-EXT", por_que: "Lo opera la DTI; se documenta AS-IS [S-29]" }
  criterio_reparto:   # D-25
    campus:
      - "Lo que debe estar en la LAN para ahorrar enlace: los nodos de caché."
      - "Lo que el nodo necesita para funcionar sin Internet: la consola y su base (D-25)."
      - "Lo que maneja datos de uso o llaves: la consola y el SIEM."
    aws:
      - "Lo que no tiene datos: EC2-GW, proxy inverso sin datos ni llaves de firma (D-24)."
      - "Lo que ya va cifrado en origen: los respaldos en S3 (restic cifra; la llave no está en AWS)."
    no_va: "Caché (shield) en AWS: un MISS servido desde AWS igual cruza el enlace del campus (D-19)."
  decisiones: [D-19, D-24, D-25, D-26, D-28]

objetivos:    # D2.3; `verificable` dice dónde se comprueba
  - { id: DC-OBJ-1, objetivo: "Dimensionar el host", indicador: "Recursos asignados vs. requeridos", meta: "100 % cubierto con ≥ 15 % de holgura", verificable: "V-92", responsable: Infraestructura }
  - { id: DC-OBJ-2, objetivo: "AWS costo-eficiente", indicador: "Costo mensual 24×7", meta: "≤ US$ 75/mes; laboratorio efímero < US$ 0,10/h", verificable: "V-94", responsable: Cloud }
  - { id: DC-OBJ-3, objetivo: "Disponibilidad", indicador: "RTO de la consola", meta: "≤ 2 h; navegación ≈ 0 (failover del PAC)", verificable: "V-94", responsable: Infraestructura }
  - { id: DC-OBJ-4, objetivo: "Respaldo inmutable", indicador: "Copias con bloqueo de borrado", meta: "100 % de la base de la consola y de las configuraciones", verificable: "V-94", responsable: Infraestructura }
  - { id: DC-OBJ-5, objetivo: "Reproducibilidad", indicador: "Tiempo para recrear EC2-GW y la VPC", meta: "≤ 15 min", verificable: "OpenTofu (S2)", responsable: Cloud }

# Figuras de este entregable (la integración híbrida reutiliza FIG-5.4 de CE0311 tal cual, sin redibujarla)
figuras:
  DC-0: { leyenda: "Figura 1.1 — Topología ejecutiva del centro de datos híbrido", seccion: "1", muestra: "Rack on-premise (ESXi) y entorno AWS, y el punto de integración (la VPN de CE0311)" }
  DC-1: { leyenda: "Figura 5.1 — Topología física propuesta del centro de datos on-premise", seccion: "5.1", muestra: "Disposición del rack de 12U, ESX01 con sus 4 NIC y sus datastores, SW-CORE01, UPS01, el enlace al FortiGate y los accesos de gestión" }
  DC-2: { leyenda: "Figura 5.2 — Diseño interno del hipervisor VMware ESXi", seccion: "5.2", muestra: "vSwitch0 y vSwitch1, port groups con su VLAN, NIC físicas, las 11 VM con sus vCPU y RAM y los datastores" }
  DC-3: { leyenda: "Figura 6.1 — Diseño de arquitectura AWS / VPC", seccion: "6.2", muestra: "Región, VPC y CIDR, subredes pub-a y app-a, IGW, VGW, tablas de rutas, endpoint de S3, S3 con Object Lock, Security Groups y NACL; EC2-DR y NAT-DR como temporales" }
referencia_hibrida: { figura: FIG-5.4, origen: "entregables/CE0311/diagramas/FIG-5.4.png", leyenda: "Figura 7.1 — Integración híbrida: VPN IPsec entre FW01 y el VGW (FIG-5.4 del Entregable 1, sin cambios)", seccion: "7" }

# ------------------------------------------------------------------------------------------------------------------
# On-premise: host, almacenamiento, red del hipervisor, VM, rack y energía (D2.4)
# ------------------------------------------------------------------------------------------------------------------
host:
  componente: ESX01
  supuesto: S-08      # servidor físico: 12 núcleos, 96 GB, 2 × 1,92 TB + 2 × 1 TB NVMe
  hipervisor:
    producto: "VMware ESXi"
    version: "8.0U3e"
    licencia: gratuita
    vcpu_max_por_vm: 8
    vcenter: false
    vadp: false
    vds_lacp: false
    ha_entre_hosts: false
    limites:
      - { limite: "Máximo 8 vCPU por VM", consecuencia: "Ninguna VM del diseño lo supera; la mayor tiene 4 vCPU (V-91)." }
      - { limite: "Sin vCenter", consecuencia: "Un solo host administrado desde su interfaz y desde JMP01; sin vMotion, sin DRS y sin HA entre hosts." }
      - { limite: "Sin VADP (API de respaldo de VMware)", consecuencia: "No se respalda la VM desde fuera: restic y pgBackRest corren dentro de cada VM (D2.9)." }
      - { limite: "vSwitch estándar, sin vDS", consecuencia: "Sin LACP: el teaming de vSwitch0 es por puerto virtual de origen." }
  chasis: { formato_u: 2 }
  cpu: { nucleos: 12 }
  ram_gb: 96
  controladora_raid: "Controladora RAID por hardware"
  gestion_fuera_banda: IPMI01
  vmk:
    - { id: vmk0, ip: 10.20.10.10, port_group: PG-MGMT, nota: "Gestión del hipervisor; la zona MGMT del inventario (derivado de ESX01.ips)" }
  nic:     # 4 NIC físicas: 2× 10 GbE trunk, 1× 1 GbE hacia el FortiGate, 1 libre
    - { id: vmnic0, velocidad_gbps: 10, uso: "Trunk 802.1Q hacia SW-CORE01 (puerto SFP+)", vswitch: vSwitch0, destino: SW-CORE01 }
    - { id: vmnic1, velocidad_gbps: 10, uso: "Trunk 802.1Q hacia SW-CORE01 (puerto SFP+)", vswitch: vSwitch0, destino: SW-CORE01 }
    - { id: vmnic2, velocidad_gbps: 1, uso: "NIC dedicada a la red de tránsito hacia el FortiGate", vswitch: vSwitch1, destino: FGT-EXT }
    - { id: vmnic3, velocidad_gbps: null, uso: "Libre (reserva)", vswitch: null, destino: null, ci: CI-80 }

almacenamiento:
  datastores:
    - id: DS-VM
      nombre: "Datastore VM (RAID 1)"
      medio: "2× SSD de 1,92 TB en RAID 1 por hardware"
      capacidad_gb: 1920
      raid: "RAID 1"
      contiene: "Discos de las VM (sin caché) y la copia local de restic"
      criticidad: Alta
      fase: F1
      por_que: "Una pareja de SSD en RAID 1 por hardware tolera la falla de un disco y aloja los discos de las 11 VM y la copia local de restic."
      si_falla: "Si fallan los dos SSD o la controladora se pierden las VM y la copia local; se reconstruyen desde plantillas e IaC y los datos desde S3 (D2.9)."
    - id: DS-CACHE1
      nombre: "Datastore caché 1"
      medio: "NVMe de 1 TB sin RAID"
      capacidad_gb: 1000
      raid: ninguno
      contiene: "Caché de EDGE01 (500 GB como punto de partida [S-04])"
      criticidad: Media
      fase: F1
      vm: EDGE01
      por_que: "NVMe dedicado a la caché de EDGE01: el contenido se reconstruye solo, por eso no lleva RAID y no compite por E/S con las VM."
      si_falla: "EDGE01 pierde su caché: sirve MISS hasta volver a llenarla; la navegación sigue por EDGE02 o DIRECT. Se reconstruye (CT-02)."
    - id: DS-CACHE2
      nombre: "Datastore caché 2"
      medio: "NVMe de 1 TB sin RAID"
      capacidad_gb: 1000
      raid: ninguno
      contiene: "Caché de EDGE02 (500 GB como punto de partida [S-04])"
      criticidad: Media
      fase: F2
      vm: EDGE02
      por_que: "NVMe dedicado a la caché de EDGE02 (fase F2), igual que el de EDGE01."
      si_falla: "EDGE02 pierde su caché: sirve MISS hasta volver a llenarla; EDGE01 y DIRECT mantienen la navegación (CT-02)."
  nota_cache: "La caché se reconstruye sola desde el origen, por eso no tiene RAID ni respaldo (D2.4, D2.9)."

hipervisor_red:
  seguridad_por_defecto: { modo_promiscuo: rechazar, cambios_mac: rechazar, transmisiones_falsificadas: rechazar }
  seguridad_nota: "v0.4: sin port groups de captura (no hay IDS01) ni vSwitch de almacenamiento (no hay NAS01): ninguna excepción de modo promiscuo."
  vswitches:
    - id: vSwitch0
      uplinks: [vmnic0, vmnic1]
      teaming: { politica: "Enrutar según el puerto virtual de origen", activo_activo: true, lacp: false }
      uso: "Trunk de las siete VLAN del proyecto y de la gestión del host hacia SW-CORE01"
      port_groups:
        - { id: PG-MGMT, vlan: 10, zona: MGMT }
        - { id: PG-SERVERS, vlan: 20, zona: SERVERS }
        - { id: PG-LAB, vlan: 30, zona: LAB }
        - { id: PG-DMZ-SVC, vlan: 40, zona: DMZ-SVC }
        - { id: PG-DMZ-HONEY, vlan: 41, zona: DMZ-HONEY }
        - { id: PG-SEC, vlan: 50, zona: SECURITY }
        - { id: PG-EDGE, vlan: 60, zona: EDGE }
        - { id: PG-FW-TRUNK, vlan: 4095, zona: null, nota: "VLAN 4095 de ESXi: entrega a FW01 todas las VLAN etiquetadas; FW01 enruta (router-on-a-stick, una subinterfaz por VLAN)" }
    - id: vSwitch1
      uplinks: [vmnic2]
      teaming: null
      uso: "Red de tránsito 10.20.0.0/29 hacia el FortiGate; solo FW01"
      port_groups:
        - { id: PG-TRANSITO, vlan: null, zona: TRANSITO, nota: "Sin etiqueta: la zona TRANSITO no tiene VLAN en el inventario; el FortiGate lo recibe por la NIC dedicada", solo: [FW01] }

maquinas_virtuales:   # mismas VM que el inventario (V-91). `disco_gb` no incluye la caché; `cache_gb` va en el datastore de caché.
  - { componente: FW01,      fase: F1, vcpu: 4, ram_gb: 8,  disco_gb: 40,  cache_gb: 0,   so: OPNsense,       port_groups: [PG-TRANSITO, PG-FW-TRUNK], datastore: DS-VM, sensible: true }
  - { componente: EDGE01,    fase: F1, vcpu: 4, ram_gb: 8,  disco_gb: 40,  cache_gb: 500, so: "Debian 13",    port_groups: [PG-EDGE],                  datastore: DS-VM, sensible: true,  datastore_cache: DS-CACHE1 }
  - { componente: CTRL01,    fase: F1, vcpu: 2, ram_gb: 8,  disco_gb: 100, cache_gb: 0,   so: "Debian 13",    port_groups: [PG-SERVERS],               datastore: DS-VM, sensible: false }
  - { componente: SIEM01,    fase: F1, vcpu: 4, ram_gb: 12, disco_gb: 300, cache_gb: 0,   so: "Ubuntu 24.04", port_groups: [PG-SEC],                   datastore: DS-VM, sensible: false }
  - { componente: PORTAL01,  fase: F1, vcpu: 1, ram_gb: 2,  disco_gb: 20,  cache_gb: 0,   so: "Debian 13",    port_groups: [PG-DMZ-SVC],               datastore: DS-VM, sensible: false }
  - { componente: HNY01,     fase: F1, vcpu: 1, ram_gb: 1,  disco_gb: 20,  cache_gb: 0,   so: "Debian 13",    port_groups: [PG-DMZ-HONEY],             datastore: DS-VM, sensible: false }
  - { componente: HNY02,     fase: F1, vcpu: 1, ram_gb: 1,  disco_gb: 10,  cache_gb: 0,   so: "Debian 13",    port_groups: [PG-LAB],                   datastore: DS-VM, sensible: false }
  - { componente: JMP01,     fase: F1, vcpu: 2, ram_gb: 4,  disco_gb: 60,  cache_gb: 0,   so: "Debian 13",    port_groups: [PG-MGMT],                  datastore: DS-VM, sensible: false }
  - { componente: LABCLI01,  fase: F1, vcpu: 2, ram_gb: 4,  disco_gb: 64,  cache_gb: 0,   so: "Windows 11",   port_groups: [PG-LAB],                   datastore: DS-VM, sensible: false }
  - { componente: KALI01,    fase: F1, vcpu: 2, ram_gb: 4,  disco_gb: 80,  cache_gb: 0,   so: "Kali Linux",   port_groups: [PG-LAB],                   datastore: DS-VM, sensible: false }
  - { componente: EDGE02,    fase: F2, vcpu: 4, ram_gb: 8,  disco_gb: 40,  cache_gb: 500, so: "Debian 13",    port_groups: [PG-EDGE],                  datastore: DS-VM, sensible: true,  datastore_cache: DS-CACHE2 }
  # Se declara aparte para que V-92 compare con las tablas de D2.4: totales por fase (el disco incluye la caché).
totales_d24: { F1: { vcpu: 23, ram_gb: 52, disco_gb: 1234 }, F2: { vcpu: 27, ram_gb: 60, disco_gb: 1774 } }
orden_arranque: [[FW01], [CTRL01], [EDGE01, EDGE02], [SIEM01], [resto]]
vm_fisicas_excluidas: { ENC01: "PC física del laboratorio, no una VM; la validación del cliente se hace además en 2–3 PCs reales (D2.4)" }

rack:
  unidades: 12
  ocupacion:   # D2.4; U12 arriba
    - { u: [12, 12], elemento: "Patch panel 24 puertos", id: CD-PP01 }
    - { u: [11, 11], elemento: "SW-CORE01 (24× 1 GbE + 2–4× SFP+ 10 GbE), con puerto break-glass", componente: SW-CORE01 }
    - { u: [10, 10], elemento: "Organizador de cables", id: CD-ORG01 }
    - { u: [6, 9], elemento: "ESX01 (2U)", componente: ESX01, alto_u: 2, ci: CI-79 }
    - { u: [1, 3], elemento: "UPS online 1,5 kVA + PDU", componente: UPS01, extra: [CD-PDU01] }
  libres_derivado: [[4, 5]]
  elementos:    # elementos dibujados en DC-1 que el inventario no registra como componente (nombre de diseño; criticidad heredada de lo que sirven)
    - { id: RACK01, nombre: "RACK01 — Rack de 12U", tipo: "Rack", funcion: "Aloja y alimenta los equipos del centro de datos", sirve_a: [ESX01, SW-CORE01, UPS01], recursos: "12U: U1–3 y U6–12 asignadas; U4–5 libres",
        por_que: "Un solo rack de 12U alcanza para un host de 2U, un switch, la UPS y la distribución; mantiene el cableado corto y el acceso físico controlado.",
        si_falla: "Un incidente físico en el rack (incendio, inundación, robo) detiene todo el servicio; la copia en S3 con Object Lock es lo que sobrevive (D2.9)." }
    - { id: CD-PP01, nombre: "CD-PP01 — Patch panel 24 puertos", tipo: "Cableado", funcion: "Ordena y rotula los enlaces del rack hacia la capa de acceso y el FortiGate", sirve_a: [SW-CORE01], recursos: "24 puertos; U12",
        por_que: "Separa el cableado fijo del cableado del equipo: un cambio de puerto no obliga a tocar el switch.",
        si_falla: "Un puerto dañado se puentea con un cable directo; no hay pérdida de datos." }
    - { id: CD-ORG01, nombre: "CD-ORG01 — Organizador de cables", tipo: "Cableado", funcion: "Guía los cables entre el switch y el servidor", sirve_a: [], recursos: "1U; U10",
        por_que: "Evita cables tensos o cruzados entre SW-CORE01 y ESX01.",
        si_falla: "Sin efecto funcional; aumenta el riesgo de desconexión accidental." }
    - { id: CD-PDU01, nombre: "CD-PDU01 — PDU", tipo: "Energía", funcion: "Distribuye la salida de la UPS a ESX01 y SW-CORE01", sirve_a: [ESX01, SW-CORE01], recursos: "En U1–3 junto a UPS01",
        por_que: "Reparte la energía de la UPS a los dos equipos sin cadenas de regletas.",
        si_falla: "ESX01 y SW-CORE01 pierden energía aunque la UPS funcione; se reemplaza la PDU o se conecta cada equipo directo a la UPS." }

energia:
  ups: UPS01
  topologia: "online"
  capacidad_kva: 1.5
  consumo_w: 480          # inventario (UPS01.por_que); D2.4 dice ≈ 400 W: ver CI-77
  autonomia_min: [15, 20]
  autonomia_nota: "A confirmar con el fabricante (D2.4)"
  nut: { servidor: JMP01, tarjeta_ups: 10.20.10.40, accion: "Lee UPS01 y apaga por SSH las VM y luego ESXi (F20); intrazona de MGMT, no cruza FW01" }
  ci: CI-77

dimensionamiento:    # D2.8
  fase: F2
  razones_overcommit: { sensible: 2, resto: 4 }
  sobrecarga_esxi: 1.1
  crecimiento: 1.2
  factor_disco: 1.3
  copia_local_restic_gb: 200
  holgura_minima: 0.15
  holgura_definicion:
    cpu: "(núcleos del host − núcleos necesarios) / núcleos del host"
    ram: "(RAM del host − RAM asignada × 1,1 de sobrecarga de ESXi) / RAM del host; con el 20 % de crecimiento reservado además, el margen resultante sigue sobre el 15 % (CI-78 resuelto: SIEM01 a 12 GB)"
    disco: "(capacidad del datastore − requerido) / capacidad del datastore"
  ci: CI-78
  red:
    objetivo_gbps: 1
    razon: "Un laboratorio de 40 PCs que descarga a la vez necesita ≈ 1 Gbps desde la caché (REQ-NF-02, ≥ 900 Mbps agregados); de ahí los 10 GbE del host."
    riesgo: "Los HIT atraviesan FW01 (D-17): en S2 se mide con iperf3 LAB → EDGE con y sin IPS; si FW01 limita, se revisa D-17."
  siem: "≈ 8 agentes + Suricata + WAF + firewall → 12 GB y 300 GB para ≈ 90 días (D2.8). Wazuh todo en uno admite hasta 25 agentes con 8 GiB: con ≈ 8 agentes, 12 GB dan holgura (CI-78)."

# ------------------------------------------------------------------------------------------------------------------
# AWS (D2.5). Las subredes, rutas, SG, NACL y el bucket los define infra/inventory.yaml (aws, componentes).
# ------------------------------------------------------------------------------------------------------------------
aws:
  region:
    laboratorio: us-east-1
    produccion_candidata: sa-east-1
    supuestos: [S-11, S-12]
    ci: CI-81
    opciones:
      - { region: us-east-1, a_favor: "Precio menor; disponible en AWS Academy [S-13]", en_contra: "Datos fuera de Sudamérica", decision: "Elegida para el laboratorio y para el costo de referencia" }
      - { region: sa-east-1, a_favor: "Datos en Sudamérica", en_contra: "Precio mayor; latencia no necesariamente menor", decision: "Candidata de producción, a confirmar por medición de latencia desde Juliaca [S-11]" }
    por_que: "A AWS no llegan datos personales: por EC2-GW pasan sesiones cifradas que no se almacenan y a S3 llegan respaldos cifrados en origen sin su llave. La residencia de datos (Ley 29733) no obliga a una región de Sudamérica."
    variable: "var.region de OpenTofu"
  elementos:    # elementos dibujados que el inventario no registra como componente (CI-13): nombre de diseño
    - id: IGW01
      nombre: "IGW01 — Internet Gateway"
      tipo: "Red (puerta a Internet)"
      funcion: "Salida y entrada de Internet de la subred pública"
      sirve_a: [EC2-GW]
      recursos: "Sin costo por hora"
      por_que: "pub-a necesita una ruta 0.0.0.0/0 a Internet para recibir el TCP 443 de los usuarios del panel (F29) y para ACME."
      si_falla: "EC2-GW queda sin tráfico de Internet: se pierde el acceso remoto; el campus no se afecta. Se recrea con OpenTofu."
    - id: VPCE-S3
      nombre: "VPCE-S3 — Gateway Endpoint de S3"
      tipo: "Red (endpoint de pasarela)"
      funcion: "Acceso privado a S3 desde la subred privada"
      sirve_a: [EC2-DR]
      recursos: "Sin costo por hora"
      por_que: "EC2-DR restaura desde S3 sin necesitar NAT para ello: el tráfico a S3 va por el endpoint, que no tiene costo por hora."
      si_falla: "Sin efecto en operación normal; el simulacro (T59) usaría NAT-DR para llegar a S3."
  reglas_aws:    # los elementos con `id` del inventario (aws.tablas_de_rutas, security_groups, nacl) se toman de ahí
    tablas: [rt-public, rt-private]
    security_groups: [sg-gw, sg-dr]
    nacl: [nacl-public, nacl-private]
  instancias:
    - componente: EC2-GW
      tipo: t3.micro
      vcpu: 2
      ram_gib: 1
      ebs_gb: 8
      ebs_tipo: gp3
      creditos_por_hora: 12
      linea_base_por_vcpu: 0.10
      horas_mes: 730
      carga_diseno:           # CI-82: D2.8 solo dice «pocos usuarios»; valores PROPUESTOS, a medir en S2
        ci: CI-82
        sesiones_simultaneas: 10
        solicitudes_por_s: 5
        cpu_medio_vcpu: 0.10
        ram_mib: 512
        nota: "Una sesión por laboratorio (S-26: 10 laboratorios) como cota superior de encargados conectados a la vez. Cifras de CPU y RAM de TLS + Coraza CRS estimadas, no medidas."
      por_que: "Solo termina TLS, aplica el WAF y reenvía; no guarda datos ni llaves de firma. Una t3.micro tiene 2 vCPU y 1 GiB; la carga de diseño usa la mitad de su línea base de CPU y de su RAM."
      alternativa_descartada: { tipo: t3.small, por_que: "Duplica la RAM (2 GiB) y el precio por hora sin que la carga lo pida; se sube de tipo si el piloto mide créditos agotándose." }
