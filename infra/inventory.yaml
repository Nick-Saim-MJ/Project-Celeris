# Servicios de red base (D1.8, D-28). v0.4: DNS y NTP en FW01, PAC en EDGE01/02, Wi-Fi según S-28.
servicios_base:
  dhcp:
    diseno: "Pools y reservas por rango de laboratorio (FW01 o el DHCP de la DTI [S-14]). Esa lista alimenta allowed_clients del nodo por rango (REQ-F-10, REQ-F-32)"
    componentes: [FW01]
    por_que: "Las reservas convierten el alcance «solo equipos institucionales» en un control"
    controles: ["DHCP snooping", "DAI", "port-security"]
    supuestos: [S-01, S-14]
  dns:
    servidor: { componente: FW01, ip: "interfaz .1 de cada VLAN", software: Unbound, dnssec: validacion }
    hacia_arriba: "DoT (TCP 853, F25)"
    clientes_reciben: "FW01 (.1 de la VLAN)"
    por_que: "Un DNS en otra VM no aportaba redundancia real: si FW01 cae, no hay ruteo entre zonas (D-28)"
    flujos: [F2, F25]
    pruebas: [T42]
    objetivos: [OD-04]
    adr: [D-28]
  pac:
    url: "http://pac.celeris.internal/wpad.dat"
    distribucion: "GPO, URL fija, sin autodescubrimiento"
    servido_por: "EDGE01 y EDGE02 (pac.rs, ya implementado)"
    registros_a: [{ componente: EDGE01, ip: 10.20.60.10 }, { componente: EDGE02, ip: 10.20.60.11 }]
    https: "se evalúa en S2"
    por_que: "Evita el secuestro de WPAD; si un nodo cae, el otro sirve el PAC"
    flujos: [F3]
    pruebas: [T09, T60]
    objetivos: [OD-03, OD-04]
    adr: [D-05, D-28]
  ntp:
    servidor: { componente: FW01, software: "NTP de OPNsense" }
    hacia_arriba: "NTS (TCP 4460 + UDP 123, F25)"
    clientes: "NTP UDP 123 (F2)"
    por_que: "Los certificados, la firma de la configuración y la correlación del SIEM dependen de la hora"
    flujos: [F2, F25]
    pruebas: [T42]
  ipv6:
    postura: "Deshabilitado en LAB"
    controles: ["RA guard", "DHCPv6 guard"]
    por_que: "Un cliente con IPv6 se saltaría la caché; además, el VGW de AWS no transporta IPv6"
    flujos: [F7]
    pruebas: [T23]
  dns_cifrado:
    dot: "TCP/UDP 853 bloqueado desde LAB"
    doh: "DoH limitado por GPO"
    por_que: "Que el cliente no salte el DNS ni el PAC"
    flujos: [F7]
    pruebas: [T24]
  wifi:
    diseno: "DNS y DHCP de la DTI; el PAC se publica en el portal (opcional) o por DHCP opción 252 si la DTI lo decide [S-28]. En el Wi-Fi se pide a la DTI aislamiento de clientes"
    por_que: "No se rediseña una red ajena"
    flujos: [F31, F32]
    pruebas: [T56, T57]
    supuestos: [S-28]

# Rangos de laboratorio dentro de la VLAN 30 (D1.8, D-23). `habilitado`: estado inicial de acceso al proxy (el encargado lo cambia
# desde la consola; el nodo lo aplica con allowed_clients por rango, REQ-F-10 y REQ-F-32). Una VLAN por laboratorio es opción de H2.
rangos_lab:
  zona: LAB
  cidr: 10.20.32.0/22
  laboratorios:
    - { id: LAB-01, cidr: 10.20.32.0/26, hosts_utiles: 62, habilitado: true }
    - { id: LAB-02, cidr: 10.20.32.64/26, hosts_utiles: 62, habilitado: true }
    - { id: LAB-03, cidr: 10.20.32.128/26, hosts_utiles: 62, habilitado: true }
    - { id: LAB-04, cidr: 10.20.32.192/26, hosts_utiles: 62, habilitado: true }
    - { id: LAB-05, cidr: 10.20.33.0/26, hosts_utiles: 62, habilitado: true }
    - { id: LAB-06, cidr: 10.20.33.64/26, hosts_utiles: 62, habilitado: true }
    - { id: LAB-07, cidr: 10.20.33.128/26, hosts_utiles: 62, habilitado: true }
    - { id: LAB-08, cidr: 10.20.33.192/26, hosts_utiles: 62, habilitado: true }
    - { id: LAB-09, cidr: 10.20.34.0/26, hosts_utiles: 62, habilitado: true }
    - { id: LAB-10, cidr: 10.20.34.64/26, hosts_utiles: 62, habilitado: true }
  reserva: { id: RES-LAB-11-12, cidr: 10.20.34.128/25, hosts_utiles: 126, descripcion: "Laboratorios 11 y 12" }
  infraestructura: { id: LAB-INFRA, cidr: 10.20.35.0/24, componentes: [ENC01, LABCLI01, KALI01, HNY02], descripcion: "Infraestructura de laboratorio: ENC01 .10, LABCLI01 .50, KALI01 .60, HNY02 .250" }
  adr: [D-23]
  cambio: CI-40

# Conectividad VPN híbrida (D1.10). Sin secretos.
vpn:
  id: VPN-HIBRIDA
  dispositivos: { onpremise: FW01, aws: VGW }
  extremo_onpremise:
    dispositivo: "FW01 OPNsense (IPsec route-based con interfaces VTI, strongSwan), detrás del FortiGate FGT-EXT"
    ip_publica: 203.0.113.10
    ip_publica_en: FGT-EXT
    ip_publica_nota: "Documentación RFC 5737 [S-15]; NAT 1:1 en el FortiGate hacia 10.20.0.2 (UDP 500/4500) [S-29]"
    ip_interna: 10.20.0.2
    nat_t: true
    nat_t_nota: "UDP 4500, porque FW01 está detrás de NAT; el NAT-T agrega 8 bytes y el margen del MSS alcanza"
    identidad_ike: { tipo: ip, valor: 203.0.113.10 }
    redes_anunciadas: [10.20.0.0/16]
    redes_anunciadas_futuro: "10.20.0.0/14"
    asn: 65020
  extremo_aws:
    dispositivo: "Virtual Private Gateway (VGW) adjunto a la VPC"
    ip_publica: "2 IP asignadas por AWS, una por túnel"
    redes_anunciadas: [10.30.0.0/16]
    asn: 64512
    asn_nota: "por defecto de AWS"
  tipo: "IPsec site-to-site, IKEv2, 2 túneles en activo/pasivo; el VGW usa un solo túnel a la vez y no reparte tráfico (sin ECMP). Transporta el panel remoto (F30) y los eventos de EC2-GW al SIEM (F13); no transporta descargas ni respaldos"
  tuneles:
    - { id: VTI1, rol: activo, red_interna: 169.254.10.0/30 }
    - { id: VTI2, rol: respaldo, red_interna: 169.254.11.0/30, bgp_as_path_prepending: true }
  redes_internas_nota: "AWS asigna o se fijan en la configuración de la VPN; se registran en el inventario"
  bgp:
    protocolo: "BGP (RFC 4271)"
    keepalive_s: 10
    hold_s: 30
    hold_nota: "valor por defecto de AWS"
    respaldo: "túnel 2 con AS-path prepending para que sea el de respaldo"
  fase1: { cifrado: AES-256-GCM-16, prf: SHA2-384, dh: "grupo 20 (ECP-384)", vida_s: 28800 }
  fase2: { cifrado: AES-256-GCM-16, pfs: "grupo 20", vida_s: 3600 }
  dpd: { intervalo_s: 10, accion: restart }
  mtu: 1400
  mss_clamping: 1360
  mss_nota: "NAT-T agrega 8 bytes; 1360 deja margen (D1.10)"
  capacidad_gbps_por_tunel: 1.25
  ipv6: "No se transporta (el VGW no lo soporta)"
  secretos: "Llave precompartida generada por AWS, guardada cifrada con SOPS; nunca en el informe ni en el repositorio"
  convergencia_meta_s: 60
  convergencia_prueba: T05
  escalamiento: "Más de una VPC o más ancho de banda: migrar de VGW a Transit Gateway (ECMP)"
  flujos_sobre_vpn: [F13, F30]
  pruebas: [T01, T02, T05, T21, T58]
  objetivos: [OD-05]

# Componentes (D1.12 al 100 % + grupos AWS de D2.5). estado: diseno | existente | fuera_de_alcance | emulado_en_lab
# `emulacion_lab` rotula lo emulado en el Modo L (Parte F4.2). Lo emulado nunca se presenta como implementado.
componentes:
  - id: FGT-EXT
    nombre: "FGT-EXT — FortiGate existente"
    tipo: firewall_existente
    zonas: [PERIMETRO, TRANSITO]
    ips:
      - { interfaz: wan, ip: 203.0.113.10, zona: PERIMETRO, nota: "IP pública fija del campus, documentación RFC 5737 [S-15]" }
      - { interfaz: transito, ip: 10.20.0.1, zona: TRANSITO, nota: "Gateway de la red de tránsito [S-29]" }
    funcion: "FortiGate existente: FortiGuard, NAT 1:1 (fuera de alcance)"
    criticidad: Alta
    estado: existente
    por_que: "Ya filtra con FortiGuard y tiene la IP pública. Reemplazarlo sería sobreingeniería y no lo controla el equipo."
    aporta_corto: "FortiGate existente: IP pública, NAT 1:1 y FortiGuard"
    aporta: "Conserva la IP pública 203.0.113.10 [S-15] y hace NAT 1:1 hacia 10.20.0.2 solo para UDP 500/4500 (IPsec con NAT-T) y TCP 80/443 (portal); excluye a EDGE01/02 de su inspección SSL profunda [S-29]; FortiGuard filtra la salida de los nodos; necesita una ruta estática a 10.20.0.0/16 vía 10.20.0.2."
    si_falla: "Todo el campus sin Internet; no depende del proyecto."
    dependencias: []
    controles: "NAT 1:1 limitado a UDP 500/4500 y TCP 80/443; inspección SSL excluida para EDGE01/02; FortiGuard en la salida; cambios mínimos pedidos a la DTI (RE-11)"
    adr: [D-26]
    req: []
    objetivos: []
    figuras: [FIG-1.1, FIG-5.1, FIG-5.2]
    supuestos: [S-15, S-29]
    flujos_justificacion: "Equipo existente fuera de alcance: transporta F8, F18, F21, F24 y F29 («vía FortiGate») sin ser origen ni destino de ninguna regla del proyecto"
    emulacion_lab: { nodo: fgt-sim, equivalencia: funcional, nota: "nftables con NAT 1:1 y NAT-T, sin FortiGuard (D5.3)" }
    cambio: CI-37

  - id: FW01
    nombre: "FW01 — Firewall OPNsense"
    tipo: firewall
    zonas: [PERIMETRO, TRANSITO, MGMT, SERVERS, LAB, DMZ-SVC, DMZ-HONEY, SECURITY, EDGE]
    ips:
      - { interfaz: wan, ip: 10.20.0.2, zona: TRANSITO, nota: "Red de tránsito 10.20.0.0/29 hacia el FortiGate (10.20.0.1) [S-29]" }
      - { interfaz: vlan10, ip: 10.20.10.1, zona: MGMT }
      - { interfaz: vlan20, ip: 10.20.20.1, zona: SERVERS }
      - { interfaz: vlan30, ip: 10.20.32.1, zona: LAB }
