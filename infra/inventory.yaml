      LAB: { estado: denegado }
      WIFI-EST: { estado: no_aplica }
      DMZ-SVC: { estado: permitido, flujos: [F32] }
      DMZ-HONEY: { estado: denegado }
      SECURITY: { estado: denegado }
      EDGE: { estado: permitido, flujos: [F31] }
      AWS: { estado: denegado }
      INTERNET: { estado: no_aplica, nota: "Por el FortiGate, como hoy: no pasa por el proyecto" }
    DMZ-SVC:
