# Servicios de red base (D1.8)
servicios_base:
  dhcp:
    diseno: "Pools por VLAN en FW01 (Kea/dnsmasq de OPNsense) o el DHCP existente de la DTI [S-14]. Reservas para los equipos de laboratorio; esa lista alimenta allowed_clients del nodo"
    componentes: [FW01]
    por_que: "400 PCs sin DHCP no es un diseño reproducible; las reservas convierten el alcance «solo equipos institucionales» en un control"
    controles: ["DHCP snooping", "DAI", "port-security"]
    supuestos: [S-01, S-14]
  dns:
    primario: { componente: SVC01, ip: 10.20.20.30, software: Unbound, dnssec: validacion }
    secundario: { componente: FW01, ip: "gateway .1 de cada VLAN", software: Unbound }
    clientes_reciben: ambos
    por_que: "Sin DNS, ni el proxy ni DIRECT funcionan: un solo servidor sería un punto único de falla oculto"
    flujos: [F2]
    pruebas: [T22]
    objetivos: [OD-04]
  pac:
    url: "http://pac.celeris.internal/wpad.dat"
    distribucion: "GPO, URL fija, sin autodescubrimiento"
    registros_a: [{ componente: SVC01, ip: 10.20.20.30 }, { componente: EDGE01, ip: 10.20.60.10 }]
    https: "se evalúa en S2"
    por_que: "Evita el secuestro de WPAD y el PAC sobrevive a la caída de SVC01"
    flujos: [F3]
    pruebas: [T09, T22]
    adr: [D-05]
  ntp:
    servidor: { componente: SVC01, software: chrony }
    hacia_arriba: "NTS (TCP 4460 + UDP 123, F25)"
    clientes: "NTP UDP 123"
    por_que: "Los certificados y la correlación del SIEM dependen de la hora"
    flujos: [F2, F25]
  ipv6:
    postura: "Deshabilitado en LAB"
    controles: ["RA guard", "DHCPv6 guard"]
    por_que: "Un cliente con IPv6 se saltaría el proxy IPv4; además, el VGW de AWS no transporta IPv6"
    flujos: [F7]
    pruebas: [T23]
  dns_cifrado:
    dot: "TCP/UDP 853 bloqueado desde LAB"
    doh: "DoH a resolvedores públicos conocidos bloqueado por política del navegador (GPO)"
    por_que: "Que el cliente no salte el DNS institucional ni el PAC"
    flujos: [F7]
    pruebas: [T24]

# Conectividad VPN híbrida (D1.10). Sin secretos.
vpn:
  id: VPN-HIBRIDA
  dispositivos: { onpremise: FW01, aws: VGW }
  extremo_onpremise:
    dispositivo: "FW01 OPNsense (IPsec route-based con interfaces VTI, strongSwan)"
    ip_publica: 203.0.113.10
    ip_publica_nota: "Documentación RFC 5737 [S-15]"
    redes_anunciadas: [10.20.0.0/16]
    redes_anunciadas_futuro: "10.20.0.0/14"
    asn: 65020
  extremo_aws:
    dispositivo: "Virtual Private Gateway (VGW) adjunto a la VPC"
    ip_publica: "2 IP asignadas por AWS, una por túnel"
    redes_anunciadas: [10.30.0.0/16]
    asn: 64512
    asn_nota: "por defecto de AWS"
  tipo: "IPsec site-to-site, IKEv2, 2 túneles en activo/pasivo; el VGW usa un solo túnel a la vez y no reparte tráfico (sin ECMP)"
  tuneles:
    - { id: VTI1, rol: activo, red_interna: 169.254.10.0/30 }
    - { id: VTI2, rol: respaldo, red_interna: 169.254.11.0/30, bgp_as_path_prepending: true }
  redes_internas_nota: "AWS asigna o se fijan en la configuración de la VPN; se registran en el inventario"
  bgp:
    protocolo: "BGP (RFC 4271)"
    keepalive_s: 10
    hold_s: 30
    hold_nota: "valor por defecto de AWS"
    respaldo: "túnel 2 con AS-path prepending para que sea el de respaldo"
  fase1: { cifrado: AES-256-GCM-16, prf: SHA2-384, dh: "grupo 20 (ECP-384)", vida_s: 28800 }
  fase2: { cifrado: AES-256-GCM-16, pfs: "grupo 20", vida_s: 3600 }
  dpd: { intervalo_s: 10, accion: restart }
  mtu: 1400
  mss_clamping: 1360
  capacidad_gbps_por_tunel: 1.25
  ipv6: "No se transporta (el VGW no lo soporta)"
  secretos: "Llave precompartida generada por AWS, guardada cifrada con SOPS; nunca en el informe ni en el repositorio"
  convergencia_meta_s: 60
  convergencia_prueba: T05
  escalamiento: "Más de una VPC o más ancho de banda: migrar de VGW a Transit Gateway (ECMP)"
  flujos_sobre_vpn: [F9, F12, F13, F16]
  pruebas: [T01, T02, T05, T21, T26]
  objetivos: [OD-05]

# Componentes (D1.12 al 100 % + grupos AWS de D2.5). estado: diseno | existente | fuera_de_alcance | emulado_en_lab
# `emulacion_lab` rotula lo emulado en el Modo L (Parte F4.2). Lo emulado nunca se presenta como implementado.
componentes:
  - id: FW01
    nombre: "FW01 — Firewall OPNsense"
    tipo: firewall
    zonas: [PERIMETRO, MGMT, SERVERS, LAB, LAB-TEST, DMZ-SVC, DMZ-HONEY, SECURITY, EDGE, BACKUP]
    ips:
      - { interfaz: wan, ip: 203.0.113.10, zona: PERIMETRO, nota: "RFC 5737 [S-15]" }
      - { interfaz: vlan10, ip: 10.20.10.1, zona: MGMT }
      - { interfaz: vlan20, ip: 10.20.20.1, zona: SERVERS }
      - { interfaz: vlan30, ip: 10.20.32.1, zona: LAB }
      - { interfaz: vlan31, ip: 10.20.31.1, zona: LAB-TEST }
      - { interfaz: vlan40, ip: 10.20.40.1, zona: DMZ-SVC }
      - { interfaz: vlan41, ip: 10.20.41.1, zona: DMZ-HONEY }
      - { interfaz: vlan50, ip: 10.20.50.1, zona: SECURITY }
      - { interfaz: vlan60, ip: 10.20.60.1, zona: EDGE }
      - { interfaz: vlan71, ip: 10.20.71.1, zona: BACKUP }
    funcion: "Firewall, ruteo, VPN, IPS, DNS secundario, DHCP"
    criticidad: Alta
    estado: diseño
    vm: { fase: F1, vcpu: 4, ram_gb: 8, disco_gb: 40, so: OPNsense, port_group: "WAN + FW-TRUNK" }
    por_que: "Todo tráfico entre zonas pasa por FW01 (D-17), de modo que cada flujo tiene una regla y un registro. Además termina la VPN IPsec y ejecuta Suricata IPS y CrowdSec."
    aporta_corto: "Ruteo entre zonas, política deny-all, IPS y VPN"
    aporta: "Una subinterfaz VLAN por zona (10, 20, 30, 31, 40, 41, 50, 60, 71) en el trunk PG-FW-TRUNK; WAN por vSwitch1/vmnic2; VTI1 y VTI2 con BGP; Unbound como DNS secundario; DHCP. La VLAN 70 no existe en FW01."
    si_falla: "Se pierde el ruteo entre VLAN, la salida a Internet y la VPN (punto único de falla, AM-12). Mitigación: BRK01 y restauración desde el XML en Git, RTO 1 h (D2.9); CARP en H3."
    dependencias: [ESX01, SW-CORE01]
    controles: "Deny-all con registro; Suricata IPS inline en WAN y DMZ-SVC; CrowdSec; anti-spoofing y bogons en WAN; GUI solo desde JMP01 con MFA (TOTP); reglas exportadas a Git con revisión de cuatro ojos"
    adr: [D-06, D-16, D-17]
    req: []
    objetivos: [OD-01, OD-02, OD-04, OD-05, OD-06, OD-07, OD-08]
    figuras: [FIG-1.1, FIG-5.1, FIG-5.2, FIG-5.3, FIG-5.4, FIG-5.5a, FIG-5.5b]
    supuestos: [S-14, S-15]
    emulacion_lab: { nodo: fw01-sim, equivalencia: funcional, nota: "Debian + nftables (reglas generadas del inventario) + strongSwan + FRR + Suricata; OPNsense no corre en contenedor" }

  - id: SW-CORE01
    nombre: "SW-CORE01 — Switch núcleo L2"
    tipo: switch
    zonas: [MGMT]
    ips:
      - { interfaz: mgmt, ip: 10.20.10.2, zona: MGMT }
    funcion: "Switch L2 gestionable, trunk, SPAN"
    criticidad: Alta
    estado: diseño
    por_que: "FW01 enruta (router-on-a-stick) y SW-CORE01 solo conmuta: necesita 802.1Q con lista explícita de VLAN y el puerto break-glass rotulado."
    aporta_corto: "Conmutación 802.1Q y puerto break-glass"
    aporta: "24× 1 GbE + 2–4× SFP+ 10 GbE; trunks con VLAN permitidas explícitas, nativa 999, puertos sin uso apagados; incluye el puerto de emergencia en VLAN 10."
    si_falla: "Cae la conectividad física de ESX01, NAS01 y la capa de acceso. Mitigación: configuración en Git; el servicio de los laboratorios depende de su reemplazo (no hay segundo switch en el diseño)."
    dependencias: [UPS01]
    controles: "Trunks con VLAN permitidas, nativa 999, BPDU/root guard en uplinks, storm control, gestión solo desde JMP01"
    adr: [D-17]
    req: []
    objetivos: [OD-01, OD-02]
    figuras: [FIG-5.1, FIG-5.2, FIG-5.3, FIG-5.5b]
    supuestos: [S-14]
    flujos_justificacion: "Conmuta en capa 2 todos los flujos sin ser origen ni destino; su gestión es parte de F20"
    emulacion_lab: { nodo: null, equivalencia: no_emulado, nota: "Bridges Linux por VLAN (br-vlanNN) sustituyen al switch y a los port groups" }

  - id: SW-ACC
    nombre: "SW-ACC — Switches de acceso existentes"
    tipo: switch_existente
    zonas: [MGMT, LAB]
    ips:
      - { interfaz: gestion, ip: null, zona: MGMT, nota: "Según levantamiento AS-IS [S-14]" }
    funcion: "Capa de acceso de los laboratorios"
    criticidad: Alta
    estado: fuera_de_alcance
    por_que: "Es la capa de acceso que ya existe en los laboratorios. Se documenta AS-IS y se exige soporte 802.1Q y los controles de capa 2; su rediseño queda fuera de alcance [S-14]."
    aporta_corto: "Conecta los PC de laboratorio a la VLAN 30"
    aporta: "Acceso a la VLAN 30 y a la VLAN 31 con DHCP snooping, DAI, IP source guard, RA guard, port-security y BPDU guard si el modelo los soporta; si no, se registra como brecha [S-14]."
    si_falla: "Un laboratorio entero pierde conectividad; el resto de la red no se afecta. Mitigación: ninguna dentro del alcance (rediseño excluido, S-14)."
    dependencias: [SW-CORE01]
    controles: "Controles de capa 2 de D1.9 (requisito); brecha registrada si no los soporta"
    adr: []
    req: []
    objetivos: [OD-01]
    figuras: [FIG-5.1, FIG-5.2, FIG-5.3]
    supuestos: [S-14]
    flujos_justificacion: "Capa 2 existente fuera de alcance: transporta F1–F7 de los usuarios sin ser origen ni destino"
    emulacion_lab: { nodo: null, equivalencia: no_emulado, nota: "No aparece en la topología F4.1" }
    pendiente: true
    cambio: CI-12

  - id: BRK01
    nombre: "BRK01 — Puerto break-glass"
    tipo: puerto_emergencia
    zonas: [MGMT]
    ips:
      - { interfaz: laptop, ip: 10.20.10.250, zona: MGMT, nota: "Laptop conectada al puerto de emergencia" }
    funcion: "Acceso de emergencia"
    criticidad: Media
    estado: diseño
    por_que: "Si FW01 cae no hay ruteo entre VLAN; el puerto rotulado en VLAN 10 permite llegar a ESXi, IPMI y DCUI para restaurar FW01 desde su XML en Git."
    aporta_corto: "Recupera FW01 sin depender del ruteo"
    aporta: "Puerto de acceso de SW-CORE01 en VLAN 10, desactivado administrativamente y activado desde la consola del switch; la laptop usa 10.20.10.250."
    si_falla: "Si el puerto no funciona, la recuperación de FW01 requiere acceso físico al servidor (iDRAC/iLO sin red). Mitigación: probado en T25."
    dependencias: [SW-CORE01]
    controles: "Puerto apagado por defecto, rotulado, activación desde la consola del switch, uso registrado"
    adr: []
    req: []
    objetivos: [OD-02]
    figuras: [FIG-5.1, FIG-5.3]
    supuestos: []
    flujos_justificacion: "Acceso de emergencia sin flujo F-nn: opera con FW01 apagado y por eso no pasa por reglas (probado en T25)"
    emulacion_lab: { nodo: null, equivalencia: no_emulado, nota: "ESXi, IPMI y el puerto no se emulan" }

  - id: ESX01
    nombre: "ESX01 — Servidor ESXi"
    tipo: hipervisor
    zonas: [MGMT, STORAGE]
    ips:
      - { interfaz: vmk0, ip: 10.20.10.10, zona: MGMT, criticidad: Alta, nota: "Gestión del hipervisor" }
      - { interfaz: vmk1, ip: 10.20.70.10, zona: STORAGE, criticidad: Media, nota: "Tráfico NFS, MTU 9000" }
    funcion: "Gestión del hipervisor (vmk0) y tráfico NFS (vmk1)"
    criticidad: Alta
    estado: diseño
    por_que: "Aloja todas las VM del diseño en un solo servidor 2U de 16 núcleos y 128 GB [S-08]; la licencia gratuita limita cada VM a 8 vCPU."
