# infra/inventory.yaml — FUENTE ÚNICA de red, zonas, componentes y flujos (CE0311, Entregable 1)
# Transcripción fiel de docs/celeris/Celeris-CE03-Infraestructura.md (v0.4: D1.8–D1.13, D2.4–D2.5, D5.3 y D7) y de
# docs/celeris/Celeris-Arquitectura-v0.4.md; la base v0.2 es docs/Celeris-Edge-Documento-Maestro.md.
# No editar a mano fuera del proceso de CAMBIOS-INVENTARIO.md. Valida con: make validate
# Convenciones: IDs del contrato (FW01…, F1–F32, S-xx, D-xx, REQ-…, OD-xx, FIG-x.x).
# v0.4 (I1): aplica CI-35…CI-43 (CE03 D7 CI-30…38, renumerados). Lo retirado conserva su ID con `estado: retirado` y
# `retirado_por`; un ID retirado NUNCA se reutiliza ni puede aparecer en algo vigente (V-44).
# Marca `pendiente: true` = contradicción o vacío del documento maestro registrado en
# docs/infra/e1/CAMBIOS-INVENTARIO.md (campo `cambio` apunta a la entrada CI-nn).

meta:
  inventario_version: "1.1"
  fecha: "2026-11-22"
  documento_base:
    archivo: docs/Celeris-Edge-Documento-Maestro.md
    version_declarada_en_cabecera: "0.2"
    version_citada_en_reglas: "0.2.1"
    nota: "La cabecera del documento dice 0.2 y el registro de cambios termina en 0.2; las reglas del proyecto citan v0.2.1. Ver CI-01."
    pendiente: true
    cambio: CI-01
  documentos_v04: [docs/celeris/Celeris-CE03-Infraestructura.md, docs/celeris/Celeris-Arquitectura-v0.4.md, docs/celeris/Celeris-00-Marco-Comun.md]
  entregable: "CE0311 — Análisis y Diseño de Red (S1, E1)"
  proyecto: "Celeris Edge — red de laboratorios del Campus Juliaca [S-01]"
  politica_por_defecto: "denegar y registrar"
  ips_publicas: "Solo rangos de documentación RFC 5737 (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24)"

# Rangos de direccionamiento (D1.8). Los CIDR de zonas, subredes AWS y reservas no pueden solaparse entre sí.
supernets:
  - { id: SEDE-JULIACA, cidr: 10.20.0.0/16, descripcion: "Sede Campus Juliaca (RFC 1918)" }
  - { id: AWS-CELERIS, cidr: 10.30.0.0/16, descripcion: "VPC de AWS (D2.5)" }
  - { id: SEDE-LIMA, cidr: 10.21.0.0/16, descripcion: "Sede futura (reserva)" }
  - { id: SEDE-TARAPOTO, cidr: 10.22.0.0/16, descripcion: "Sede futura (reserva)" }
  - { id: CAMPUS-RESUMEN, cidr: 10.20.0.0/14, descripcion: "Resumen de todo el campus; agrega las sedes. No participa en el chequeo de solapamientos", resumen: true }

reservas:
