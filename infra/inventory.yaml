# Matriz zona × zona esperada (D1.8 v0.4), transcrita celda por celda. Fila = origen; columna = destino.
# estado: permitido | denegado | no_aplica ("—" del documento). `bloqueados` = flujos bloqueados explícitos (✖ Fn).
# La matriz no incluye una fila Perímetro ni Tránsito: los flujos que nacen o terminan en FW01 son locales al firewall y no se derivan.
# WIFI-EST solo es fila en D1.8 v0.4; su columna se acepta como «denegado» (CI-45, resuelto). LAB-TEST, STORAGE y BACKUP salen de la matriz (retiradas, CI-39).
matriz_esperada:
  orden: [MGMT, SERVERS, LAB, WIFI-EST, DMZ-SVC, DMZ-HONEY, SECURITY, EDGE, AWS, INTERNET]
  celdas:
    MGMT:
      MGMT: { estado: no_aplica }
      SERVERS: { estado: permitido, flujos: [F20] }
      LAB: { estado: permitido, flujos: [F20] }
      WIFI-EST: { estado: denegado, nota: "D1.8 v0.4 no tiene columna WIFI-EST: se acepta denegado (CI-45 resuelto el 2026-11-22)" }
      DMZ-SVC: { estado: permitido, flujos: [F20] }
      DMZ-HONEY: { estado: permitido, flujos: [F20] }
      SECURITY: { estado: permitido, flujos: [F20] }
      EDGE: { estado: permitido, flujos: [F20] }
      AWS: { estado: denegado, nota: "SSM por Internet" }
      INTERNET: { estado: permitido, flujos: [F27], nota: "TCP 443 actualizaciones: F27 se agrega al contrato (CI-05, CI-29)" }
    SERVERS:
      MGMT: { estado: denegado }
      SERVERS: { estado: no_aplica }
      LAB: { estado: denegado }
      WIFI-EST: { estado: denegado, nota: "D1.8 v0.4 no tiene columna WIFI-EST: se acepta denegado (CI-45 resuelto el 2026-11-22)" }
      DMZ-SVC: { estado: denegado }
      DMZ-HONEY: { estado: denegado }
      SECURITY: { estado: permitido, flujos: [F13] }
      EDGE: { estado: denegado }
      AWS: { estado: denegado }
      INTERNET: { estado: permitido, flujos: [F18], nota: "solo S3" }
    LAB:
      MGMT: { estado: denegado }
      SERVERS: { estado: permitido, flujos: [F28], nota: "solo ENC01" }
      LAB: { estado: no_aplica }
      WIFI-EST: { estado: denegado, nota: "D1.8 v0.4 no tiene columna WIFI-EST: se acepta denegado (CI-45 resuelto el 2026-11-22)" }
      DMZ-SVC: { estado: permitido, flujos: [F5] }
