# Arquitectura AWS (D2.5 v0.4, F5). Los CIDR de la VPC y de las subredes salen de `componentes` (AWS-VPC, AWS-PUB-A, AWS-APP-A).
# Aquí va lo que no cabe en un componente: rutas, Security Groups, NACL, S3, IAM y el simulacro de recuperación.
# Las referencias se resuelven en infra/gen/tofu.py (I3): «zona:EDGE» → su CIDR, «componente:CTRL01» → su IP /32,
# «supernet:SEDE-JULIACA» → 10.20.0.0/16. Lo que D2.5 no define y la IaC necesita se marca con `ci` (CAMBIOS-INVENTARIO.md).
aws:
  region: { laboratorio: us-east-1, produccion_candidata: sa-east-1, nota: "var.region de OpenTofu; la región de producción se confirma con medición [S-11]" }
  etiquetas: { Proyecto: celeris-edge, Ttl_por_defecto: 4h, nota: "Ttl: las sesiones de AWS Academy duran 4 h (F2); el valor es una variable" }
  presupuesto: { alarma_porcentaje: 80, referencia: RE-07 }
  tablas_de_rutas:
    - id: rt-public
      subredes: [AWS-PUB-A]
      rutas:
        - { destino: 0.0.0.0/0, salto: internet_gateway }
        - { destino: "supernet:SEDE-JULIACA", salto: vgw, nota: "propagada por BGP" }
    - id: rt-private
      subredes: [AWS-APP-A]
      rutas:
        - { destino: "supernet:SEDE-JULIACA", salto: vgw, nota: "propagada por BGP" }
        - { destino: prefijo_s3, salto: gateway_endpoint_s3, nota: "sin costo por hora" }
        - { destino: 0.0.0.0/0, salto: "nat:NAT-DR", solo_en_simulacro: true, nota: "instancia NAT temporal" }
  security_groups:
    - id: sg-gw
      componente: EC2-GW
      ingress:
        - { proto: tcp, puerto: 443, origen: "cidr:0.0.0.0/0", flujo: F29 }
      egress:
        - { proto: tcp, puerto: 443, destino: "componente:CTRL01", flujo: F30 }
        - { proto: tcp, puertos: [1514, 1515], destino: "componente:SIEM01", flujo: F13 }
        - { proto: tcp, puerto: 443, destino: "cidr:0.0.0.0/0", nota: "ACME y actualizaciones" }
    - id: sg-dr
      componente: EC2-DR
      temporal: true
      ingress: []
      egress:
        - { proto: tcp, puerto: 443, destino: prefijo_s3, nota: "Gateway Endpoint de S3" }
        - { proto: todo, destino: "componente:NAT-DR", nota: "instalación de paquetes durante el simulacro" }
  nacl:
    - id: nacl-public
      subredes: [AWS-PUB-A]
      ingress:
        - { accion: deny, proto: tcp, puertos: [22, 3389], origen: "cidr:0.0.0.0/0", nota: "D2.5: denegar SSH y RDP desde Internet" }
        - { accion: allow, proto: tcp, puertos: [443], origen: "cidr:0.0.0.0/0" }
        - { accion: allow, proto: tcp, rango: [1024, 65535], origen: "cidr:0.0.0.0/0", nota: "efímeros de retorno" }
      egress: todo
    - id: nacl-private
      subredes: [AWS-APP-A]
      ingress:
        - { accion: allow, proto: tcp, puertos: [443], origen: "componente:AWS-PUB-A", nota: "CI-46 (resuelto 2026-11-22): TCP 443 desde pub-a" }
        - { accion: allow, proto: tcp, rango: [1024, 65535], origen: "cidr:0.0.0.0/0", nota: "efímeros de retorno; sin SSH" }
      egress:
        - { accion: allow, proto: tcp, puertos: [443], destino: "cidr:0.0.0.0/0", nota: "S3 por el Gateway Endpoint y NAT-DR en el simulacro" }
        - { accion: allow, proto: tcp, rango: [1024, 65535], destino: "cidr:0.0.0.0/0", nota: "efímeros de retorno" }
  s3:
    componente: S3
    bucket: celeris-backups
    versionado: true
    object_lock: { dias: 30, modo: compliance }
    politica: "Solo acepta la IP pública del campus; credencial aparte con solo s3:PutObject y condición de IP de origen [S-30]; en AWS Academy, el perfil que provee el laboratorio [S-13]"
    cifrado: "restic cifra en origen; la llave no está en AWS"
    flujo: F18
  iam:
    ec2_gw: "Perfil de instancia sin permisos sobre S3"
    respaldo: "Credencial aparte con solo s3:PutObject en el bucket y condición de IP de origen = IP pública del campus [S-30]"
    cuenta: "MFA, CloudTrail, AWS Budgets al 80 %, etiqueta Ttl en los recursos efímeros"
    cloudwatch: "Métricas básicas de EC2-GW y del estado de los túneles"
  simulacro_recuperacion:
    prueba: T59
    instancias: [EC2-DR, NAT-DR]
    rto_h: 2
    regla: "Se crean solo durante el simulacro (estado temporal) y se destruyen al terminar; etiqueta Ttl"
  administracion: "SSM Session Manager o EC2 Instance Connect; sin bastion y sin puerto 22 público (D2.5)"
  # Modo A (D5.4): la VPC que simula el campus. Parámetros del laboratorio, no de D1.8 (CI-23).
  onprem_sim:
    vpc: { nombre: onprem-sim, cidr: "supernet:SEDE-JULIACA" }
    cgw_sim: { tipo: t3.micro, subred_cidr: 10.20.0.0/24, ip_elastica: true, source_dest_check: false, ci: CI-25, nota: "Publica un servidor de prueba como CTRL01 (D5.4); su subred 10.20.0.0/24 solapa con el tránsito 10.20.0.0/29 solo dentro de la VPC de simulación" }
    labcli_sim: { tipo: t3.micro, componente: LABCLI01, zona: LAB }
