    aporta: "Se conecta al FortiGate FGT-EXT por la red de tránsito 10.20.0.0/29 (WAN 10.20.0.2; FortiGate 10.20.0.1); una subinterfaz VLAN por zona (10, 20, 30, 40, 41, 50, 60) en el trunk PG-FW-TRUNK; VTI1 y VTI2 con BGP y NAT-T (identidad IKE 203.0.113.10); Unbound con DNSSEC y NTP en la interfaz .1 de cada VLAN (F2), NTS y DoT hacia arriba (F25); Suricata IPS inline en tránsito y DMZ-SVC e IDS en las interfaces LAB y SERVERS (DET-02); CrowdSec; DHCP con reservas por rango de laboratorio."
    si_falla: "Se pierde el ruteo entre VLAN, la salida a Internet, la VPN y el DNS y NTP de las zonas (punto único de falla, AM-12). Mitigación: BRK01 y restauración desde el XML en Git, RTO 1 h (D2.9); CARP en H3."
    dependencias: [FGT-EXT, ESX01, SW-CORE01]
    controles: "Deny-all con registro; Suricata IPS inline en tránsito y DMZ-SVC e IDS en LAB y SERVERS; CrowdSec; anti-spoofing y bogons en WAN, excepto 10.20.0.0/29, la red del Wi-Fi (172.16.0.0/16, solo hacia F31/F32) y 10.30.0.0/16 por VTI; GUI solo desde JMP01 con MFA (TOTP); reglas exportadas a Git con revisión de cuatro ojos"
    adr: [D-06, D-16, D-17, D-26, D-28]
