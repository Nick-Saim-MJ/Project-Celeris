      SECURITY: { estado: permitido, flujos: [F13], nota: "solo HNY02" }
      EDGE: { estado: permitido, flujos: [F1, F3] }
      AWS: { estado: denegado }
      INTERNET: { estado: permitido, flujos: [F6], bloqueados: [F7], nota: "F6 solo en el piloto; F7 bloqueado siempre" }
    WIFI-EST:
      MGMT: { estado: denegado }
