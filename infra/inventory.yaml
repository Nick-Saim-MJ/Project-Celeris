      LAB: { estado: denegado }
      WIFI-EST: { estado: denegado, nota: "D1.8 v0.4 no tiene columna WIFI-EST: se acepta denegado (CI-45 resuelto el 2026-11-22)" }
      DMZ-SVC: { estado: no_aplica }
