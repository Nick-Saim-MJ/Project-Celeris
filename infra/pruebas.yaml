    detecciones: [DET-06]
    celdas_matriz: []

  - id: T15
    categoria: seguridad_web
    nombre: "Exposición del portal"
    origen: INTERNET
    destino: FW01
    flujos: [F21, F24]
    componentes: [FW01, PORTAL01, HNY01, SIEM01]
    objetivo_que_valida: "Desde Internet solo se ven 80 y 443 (y los señuelos en ventana autorizada)"
