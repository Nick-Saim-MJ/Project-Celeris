  - id: T21
    categoria: vpn
    nombre: "MTU del túnel"
    origen: CTRL01
    destino: EC2-SHIELD
    flujos: [F16]
    componentes: [CTRL01, FW01, VTI1, VGW, EC2-SHIELD]
    objetivo_que_valida: "MTU 1400 y MSS clamping 1360 evitan la fragmentación (D1.10)"
    precondicion: "VPN establecida; el origen no está fijado en D1.16 y se usa el de T01"
    comando: "ping -M do -s 1372 -c 3 10.30.10.10 ; ping -M do -s 1400 -c 3 10.30.10.10"
    resultado_esperado: "El primero pasa; el segundo falla por tamaño, sin cortes de TCP"
    criterio_aprobacion:
      - { tipo: exit_code, valor: 0, comando_adicional: "ping -M do -s 1372 -c 3 10.30.10.10", nota: "1372 + 28 = 1400 = MTU" }
      - { tipo: exit_code, valor: distinto_de_0, comando_adicional: "ping -M do -s 1400 -c 3 10.30.10.10" }
      - { tipo: regex, sobre: stdout, patron: "(?i)(message too long|frag needed)", comando_adicional: "ping -M do -s 1400 -c 3 10.30.10.10" }
    automatizable: true
    critica: true
    evidencia_a_capturar: ["Salida de ambos ping", "Sesión TCP sostenida durante la prueba (sin reinicios)"]
    modos: [A, H]
    semestre: S2
    criterios_rubrica: [R3]
    objetivos: [OD-05, OD-07]
    amenazas: []
    detecciones: []
    celdas_matriz: []
    pendiente: true
    cambio: CI-08

