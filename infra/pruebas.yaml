  - id: T13
    categoria: deteccion
    nombre: "Abuso del proxy"
    origen: LABCLI01
    destino: EDGE01
    flujos: [F1]
    componentes: [LABCLI01, EDGE01, ESX01, SIEM01]
    objetivo_que_valida: "El nodo bloquea el uso del proxy para alcanzar redes internas (SSRF) y lo registra"
    precondicion: "Proxy de EDGE01 con allowed_internal_networks vacío"
    comando: "curl -sS -o /dev/null -w \"%{http_code}\" -p -x http://10.20.60.10:3128 https://10.20.10.10:443/"
    resultado_esperado: "403 + detección destination_blocked"
    criterio_aprobacion:
      - { tipo: regex, sobre: stdout, patron: "^403$" }
      - { tipo: regex, sobre: registro_celeris, patron: "destination_blocked" }
    automatizable: true
    critica: false
    polaridad: negativa
    evidencia_a_capturar: ["Código HTTP devuelto", "Línea del registro de seguridad de Celeris con destination_blocked", "Alerta en Wazuh"]
    modos: [L, H]
    semestre: S2
    criterios_rubrica: [R4, R5]
    objetivos: [OD-06, OD-09]
    amenazas: [AM-01, AM-04]
    detecciones: [DET-06]
    celdas_matriz: []

  - id: T14
    categoria: deteccion
    nombre: "Puerto no permitido"
    origen: LABCLI01
    destino: EDGE01
    flujos: [F1]
    componentes: [LABCLI01, EDGE01, SIEM01]
    objetivo_que_valida: "El nodo rechaza CONNECT a puertos no listados (REQ-F-11) y lo registra"
    precondicion: "connect_ports de EDGE01 sin el puerto 25"
    comando: "curl -sS -o /dev/null -w \"%{http_code}\" -p -x http://10.20.60.10:3128 https://example.com:25/"
    resultado_esperado: "403 + evento port_blocked"
    criterio_aprobacion:
      - { tipo: regex, sobre: stdout, patron: "^403$" }
      - { tipo: regex, sobre: registro_celeris, patron: "port_blocked" }
    automatizable: true
    critica: false
    polaridad: negativa
    evidencia_a_capturar: ["Código HTTP devuelto", "Línea del registro de seguridad de Celeris con port_blocked"]
    modos: [L, H]
