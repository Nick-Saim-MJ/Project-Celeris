    origen: OBS01
    destino: EDGE01
    flujos: [F12]
    componentes: [OBS01, EDGE01, FW01]
    objetivo_que_valida: "El scraping de 9128 viaja solo por TLS y el token no aparece en claro (REQ-NF-14)"
    precondicion: "Scraping Prometheus 10.20.20.20 → 10.20.60.10:9128 activo"
    comando: "tcpdump -nn -w scrape.pcap host 10.20.60.10 and port 9128"
    resultado_esperado: "Solo TLS; el token no aparece en claro"
    criterio_aprobacion:
      - { tipo: contador, metrica: paquetes_http_en_claro, operador: "==", valor: 0, comando_adicional: "tshark -r scrape.pcap -Y http" }
      - { tipo: regex, sobre: scrape.pcap, patron: "(?i)authorization:|bearer ", debe_coincidir: false }
      - { tipo: contador, metrica: handshakes_tls, operador: ">", valor: 0, comando_adicional: "tshark -r scrape.pcap -Y tls.handshake" }
      - { tipo: contador, metrica: respuestas_http_en_claro_del_servidor, operador: "==", valor: 0, nota: "una petición HTTP en claro al 9128 (sin token) no recibe respuesta" }
    automatizable: true
    critica: true
    evidencia_a_capturar: ["scrape.pcap", "Salida de tshark"]
    modos: [L, H]
    semestre: S2
    criterios_rubrica: [R6]
