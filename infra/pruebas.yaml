  # ---------------------------------------------------------------------------------------------------------------
  # Ampliación T29+ (CI-27): pruebas que D1.16 no define y que la cobertura de la matriz exige. Ninguna sustituye a
  # T01–T28. `ampliacion: true` las distingue; `polaridad` dice si la prueba espera tráfico permitido o denegado.
  # Los modos son H (y A donde interviene AWS): el runner del Modo L (tests/network) aún no tiene casos para ellas.
  # ---------------------------------------------------------------------------------------------------------------

  - id: T29
    categoria: deteccion
    nombre: "Escaneo lateral detectado por Suricata de FW01"
    origen: KALI01
    destino: CTRL01
    flujos: []
    flujos_justificacion: "Prueba de detección con tráfico denegado: ningún F-nn alcanza CTRL01 desde KALI01 (F28 es solo de ENC01); Suricata de FW01 observa la interfaz LAB"
    componentes: [KALI01, FW01, SIEM01, CTRL01]
    objetivo_que_valida: "Suricata IDS (DET-02) detecta el escaneo de red desde LAB hacia SERVERS aunque FW01 lo deniegue, y Wazuh lo correlaciona"
    precondicion: "KALI01 en 10.20.35.60; Suricata de FW01 en modo IDS en las interfaces LAB y SERVERS con reglas ET Open al día; syslog TLS de FW01 hacia SIEM01 (F14)"
    comando: "nmap -Pn -sS -p 1-1024 --max-rate 100 10.20.20.10"
    resultado_esperado: "Sin puertos abiertos; alerta de Suricata en FW01 y alerta de Wazuh de nivel ≥ 10 en menos de 60 s"
    criterio_aprobacion:
      - { tipo: contador, metrica: puertos_open, operador: "==", valor: 0, nota: "FW01 deniega LAB → CTRL01 (F28 es solo de ENC01)" }
      - { tipo: regex, sobre: eve_json_fw01, patron: "\"signature\":\\s*\"[^\"]*([Ss][Cc][Aa][Nn]|escaneo)", nota: "firma de un barrido: ET SCAN en S2, regla local sid 9000001 en el Modo L" }
      - { tipo: regex, sobre: eve_json_fw01, patron: "\"src_ip\":\\s*\"10\\.20\\.35\\.60\"", nota: "la alerta nombra a KALI01 como origen" }
      - { tipo: regex, sobre: alerta_wazuh, patron: "\"level\":\\s*(1[0-9]|[2-9][0-9])" }
      - { tipo: umbral, metrica: latencia_alerta_wazuh_s, operador: "<", valor: 60, nota: "desde el primer SYN hasta la alerta en Wazuh" }
    automatizable: true
    critica: false
    polaridad: negativa
    evidencia_a_capturar: ["Salida de nmap", "Línea de eve.json de FW01 con la alerta", "Alerta de Wazuh (JSON) con marca de tiempo", "Contador de las reglas de denegación de LAB hacia SERVERS en FW01"]
    modos: [L, H]
    semestre: S2
    criterios_rubrica: [R4, R5]
    objetivos: [OD-01, OD-09]
    amenazas: []
    detecciones: [DET-02]
    celdas_matriz: ["LAB>SERVERS"]
    ampliacion: true
    cambio: CI-27

