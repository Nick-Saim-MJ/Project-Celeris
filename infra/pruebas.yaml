# infra/pruebas.yaml — Pruebas de conectividad planeadas T01–T28 (D1.16), ejecutables en S2.
# Fuente de la matriz de pruebas XLSX y de tests/network/*.yaml del laboratorio (make test-lab).
#
# modos: L = emulación local (containerlab), A = AWS efímero, H = híbrido real (campus).
#   La asignación de modos sigue la Parte F: F1/F3 (L: T06–T20 y T22–T28; A: T01–T05, T21 y T26)
#   y F4.3 (T05 se demuestra también en L).
# criterio_aprobacion: lista de verificaciones. tipo ∈ exit_code | regex | umbral | contador | manual.
#   `automatizable: false` cuando alguna verificación requiere intervención humana.
# polaridad: positiva (se espera tráfico o resultado permitido), negativa (se espera denegación) o mixta (ambas).
# ampliacion: true en T29+ (CI-27): pruebas que D1.16 no define; T01–T28 son el contrato.
# critica: true si un FALLA invalida un límite de seguridad del diseño (V-42 lo exige en resultados.json). Regla adoptada: categoría
#   segmentacion, vpn o cifrado (CI-26); el equipo puede cambiarla marcando la prueba a mano.
# Los comandos son los «comandos sugeridos» de D1.16; los argumentos añadidos solo hacen que terminen
# o produzcan una salida verificable (-c, -w, -m, -o /dev/null -w). No añaden puertos ni IP.
# `pendiente: true` = vacío o contradicción registrado en docs/infra/e1/CAMBIOS-INVENTARIO.md.

meta:
  version: "1.1"
  fecha: "2026-11-19"
  documento_base: "docs/Celeris-Edge-Documento-Maestro.md, D1.16"
  evidencias_ruta: "evidencias/<fecha>-<modo>/"

pruebas:
  - id: T01
    categoria: vpn
    nombre: "ON-PREM → AWS"
    origen: CTRL01
    destino: EC2-SHIELD
    flujos: []
    flujos_justificacion: "ICMP no figura en F1–F26 (CI-08)"
    componentes: [CTRL01, FW01, VTI1, VGW, EC2-SHIELD]
    objetivo_que_valida: "La VPN lleva tráfico de 10.20.0.0/16 a 10.30.0.0/16 (D1.10)"
    precondicion: "Túnel 1 en estado ESTABLISHED y sesión BGP en Established"
    comando: "ping -c 4 10.30.10.10"
    resultado_esperado: "Permitido (VPN)"
    criterio_aprobacion:
      - { tipo: exit_code, valor: 0 }
      - { tipo: regex, sobre: stdout, patron: "(?m)\\b0% packet loss" }
    automatizable: true
    critica: true
    polaridad: positiva
    evidencia_a_capturar: ["Salida de ping", "swanctl --list-sas", "Resumen BGP (vtysh -c 'show bgp summary')"]
    modos: [A, H]
    semestre: S2
    criterios_rubrica: [R3]
    objetivos: [OD-05]
    amenazas: []
    detecciones: []
    celdas_matriz: [SERVERS>AWS]
    pendiente: true
    cambio: CI-08

  - id: T02
    categoria: vpn
    nombre: "AWS → ON-PREM"
    origen: EC2-CTRLR
    destino: DB01
    flujos: [F16]
    componentes: [EC2-CTRLR, VGW, VTI1, FW01, DB01]
    objetivo_que_valida: "Desde AWS solo se alcanza la réplica hacia DB01 en TCP 5432"
    precondicion: "VPN establecida; DB01 escuchando en 10.20.20.11:5432"
    comando: "nc -zv 10.20.20.11 5432"
    resultado_esperado: "Permitido solo 5432"
    criterio_aprobacion:
      - { tipo: exit_code, valor: 0, nota: "puerto 5432" }
      - { tipo: exit_code, valor: distinto_de_0, comando_adicional: "nc -zv -w 3 10.20.20.11 22", nota: "cualquier otro puerto (22 como ejemplo negativo)" }
    automatizable: true
    critica: true
    polaridad: positiva
    evidencia_a_capturar: ["Salida de nc para 5432 y para el puerto negativo", "Contador de la regla F16 en FW01"]
    modos: [A, H]
    semestre: S2
    criterios_rubrica: [R3, R6]
    objetivos: [OD-05, OD-06]
    amenazas: []
    detecciones: []
    celdas_matriz: [AWS>SERVERS]

