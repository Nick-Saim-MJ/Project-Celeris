    comando: "Navegador con QUIC activado; verificación: curl --http3 -m 5 https://example.com"
    resultado_esperado: "Bloqueado; el navegador usa TCP"
    criterio_aprobacion:
      - { tipo: exit_code, valor: distinto_de_0, comando_adicional: "curl --http3 -m 5 https://example.com" }
      - { tipo: contador, metrica: paquetes_bloqueados_regla_F7, operador: ">", valor: 0 }
      - { tipo: manual, descripcion: "El navegador carga la página por HTTP/2 sobre TCP" }
    automatizable: false
    critica: true
    polaridad: negativa
    evidencia_a_capturar: ["Contador de la regla F7 en FW01", "Pestaña de red del navegador con el protocolo usado"]
    modos: [L, H]
    semestre: S2
    criterios_rubrica: [R4]
    objetivos: [OD-06]
    amenazas: []
    detecciones: []
    celdas_matriz: [LAB>INTERNET]

  - id: T09
