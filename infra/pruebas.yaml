    origen: [HNY01, WEB01]
    destino: EC2-SHIELD
    flujos: []
    flujos_justificacion: "Prueba de denegación por política por defecto: ningún F-nn permite DMZ → AWS"
    componentes: [HNY01, WEB01, FW01, EC2-SHIELD]
    objetivo_que_valida: "Las DMZ no alcanzan la VPC (celdas DMZ-SVC→AWS y DMZ-HONEY→AWS denegadas)"
    precondicion: "VPN establecida"
    comando: "ping -c 4 -W 2 10.30.10.10"
    resultado_esperado: "Denegado"
    criterio_aprobacion:
      - { tipo: exit_code, valor: distinto_de_0 }
      - { tipo: regex, sobre: stdout, patron: "(?m)\\b100% packet loss" }
    automatizable: true
    critica: true
    polaridad: negativa
    evidencia_a_capturar: ["Salida de ping desde HNY01 y desde WEB01", "Registro de denegación en FW01 (log de la regla por defecto)"]
    modos: [A, H]
    semestre: S2
    criterios_rubrica: [R2, R4]
    objetivos: [OD-01, OD-06]
    amenazas: []
    detecciones: []
