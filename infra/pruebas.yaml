    cambio: CI-41

  - id: T60
    categoria: segmentacion
    nombre: "Secuestro de WPAD"
    origen: LABCLI01
    destino: EDGE01
    flujos: [F3, F2]
    componentes: [LABCLI01, EDGE01, EDGE02, FW01]
    objetivo_que_valida: "Un equipo de LAB que anuncia `wpad` por DNS y DHCP no engaña a las PCs con la URL fija del PAC por GPO (AM-02)"
    precondicion: "LABCLI01 con la URL fija http://pac.celeris.internal/wpad.dat por GPO; un equipo de LAB (KALI01) anuncia el nombre wpad por DNS y DHCP"
    comando: "curl -sS http://pac.celeris.internal/wpad.dat ; curl -sS -o /dev/null -w \"%{http_code}\" http://wpad/wpad.dat   # en LABCLI01, con el anuncio falso activo"
    resultado_esperado: "El PAC que usa LABCLI01 es el de EDGE01/02; el anuncio falso se ignora"
    criterio_aprobacion:
      - { tipo: regex, sobre: stdout, patron: "FindProxyForURL", comando_adicional: "curl http://pac.celeris.internal/wpad.dat" }
      - { tipo: regex, sobre: stdout, patron: "10\\.20\\.60\\.1[01]:3128", comando_adicional: "curl http://pac.celeris.internal/wpad.dat" }
      - { tipo: exit_code, valor: 0, comando_adicional: "nslookup pac.celeris.internal 10.20.32.1", nota: "el nombre fijo se resuelve con el DNS de FW01 (F2)" }
      - { tipo: contador, metrica: peticiones_a_la_url_falsa_wpad, operador: "==", valor: 0 }
