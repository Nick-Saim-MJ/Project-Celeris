    nombre: "Caída de EDGE01"
    origen: LABCLI01
    destino: EDGE02
    flujos: [F1, F3, F6]
    componentes: [LABCLI01, EDGE01, EDGE02, SVC01, FW01]
    objetivo_que_valida: "El PAC conmuta a EDGE02 y, con ambos caídos, a DIRECT; mide el tiempo de cambio (OD-03)"
    precondicion: "PAC con EDGE01, EDGE02 y DIRECT; modo piloto (F6 permitido)"
    comando: "Apagar EDGE01 y navegar con navegador real; luego apagar EDGE02"
    resultado_esperado: "El PAC usa EDGE02; con ambos caídos, DIRECT; tiempo de cambio medido"
    criterio_aprobacion:
      - { tipo: manual, descripcion: "Con EDGE01 apagado la navegación continúa por EDGE02 (registro de acceso de EDGE02)" }
      - { tipo: manual, descripcion: "Con ambos apagados la navegación continúa por DIRECT (F6, solo piloto)" }
      - { tipo: umbral, metrica: tiempo_de_cambio_s, operador: ">=", valor: 0, nota: "D1.16 no fija umbral: se reporta el valor medido" }
    automatizable: false
    critica: false
    polaridad: positiva
    evidencia_a_capturar: ["Cronometraje del cambio de nodo", "Registros de acceso de EDGE01 y EDGE02", "Captura del navegador"]
    modos: [L, H]
    semestre: S2
    criterios_rubrica: [R2, R6]
    objetivos: [OD-03]
    amenazas: []
    detecciones: []
    celdas_matriz: []

