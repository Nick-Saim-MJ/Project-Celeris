    destino: "NAS01:almacenamiento"
    flujos: []
    flujos_justificacion: "Prueba de ausencia de ruta: la VLAN 70 no tiene gateway ni interfaz en FW01"
    componentes: [LABCLI01, CTRL01, FW01, NAS01]
    objetivo_que_valida: "La VLAN 70 no es alcanzable desde ninguna zona (STORAGE sin ruteo)"
    precondicion: "NAS01 con interfaz de almacenamiento en 10.20.70.20"
    comando: "ping -c 4 -W 2 10.20.70.20"
    resultado_esperado: "Sin respuesta (sin gateway)"
