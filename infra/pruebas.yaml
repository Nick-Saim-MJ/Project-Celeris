    flujos: [F31, F32]
    flujos_justificacion: "Prueba de denegación: WIFI-EST solo tiene F31 (EDGE) y F32 (PORTAL01); F31 se usa solo como control positivo"
    componentes: [WIFI-EST, FW01, CTRL01, ESX01, LABCLI01]
    objetivo_que_valida: "El Wi-Fi de estudiantes no alcanza la consola, la gestión ni los laboratorios; solo llega a EDGE y al portal (F31, F32)"
    precondicion: "Equipo BYOD en 172.16.0.0/16 (byod01 en el Modo L); objetivos: CTRL01 10.20.20.10, ESX01 10.20.10.10, LABCLI01 10.20.35.50; controles positivos: EDGE01 10.20.60.10:3128 (F31) y PORTAL01 10.20.40.10:443 (F32)"
    comando: "nmap -Pn -sS -p 22,443,3128,5432,8443,9128,2049 10.20.20.10 10.20.10.10 10.20.35.50 ; nc -zv -w3 10.20.60.10 3128 ; nc -zv -w3 10.20.40.10 443"
    resultado_esperado: "Ningún puerto abierto en CTRL01, MGMT ni LAB; el control positivo hacia EDGE01:3128 sí abre; denegaciones registradas"
    criterio_aprobacion:
      - { tipo: contador, metrica: puertos_open, operador: "==", valor: 0 }
      - { tipo: exit_code, valor: 0, comando_adicional: "nc -zv -w3 10.20.60.10 3128 ; nc -zv -w3 10.20.40.10 443", nota: "control positivo: sin él, la denegación no demuestra nada" }
      - { tipo: exit_code, valor: 0, comando_adicional: "nc -zv -w3 10.20.40.10 443", nota: "control positivo de F32" }
      - { tipo: contador, metrica: paquetes_denegados_por_fw01, operador: ">", valor: 0 }
    automatizable: true
    critica: true
    polaridad: mixta
    evidencia_a_capturar: ["Salida de nmap y nc", "Contadores de las reglas de denegación de WIFI-EST en FW01"]
    modos: [L, H]
    semestre: S2
    criterios_rubrica: [R4]
    objetivos: [OD-01, OD-06]
    amenazas: [AM-11, AM-17]
    detecciones: []
    celdas_matriz: ["WIFI-EST>SERVERS", "WIFI-EST>MGMT", "WIFI-EST>LAB", "WIFI-EST>SECURITY"]
    ampliacion: true
    cambio: CI-41

  - id: T58
    categoria: segmentacion
    nombre: "EC2-GW solo alcanza CTRL01:443 y SIEM01"
    origen: EC2-GW
    destino: [SERVERS, SECURITY, MGMT, LAB, EDGE]
    flujos: [F30, F13]
    componentes: [EC2-GW, VGW, FW01, CTRL01, SIEM01]
    objetivo_que_valida: "Un EC2-GW comprometido no sirve de pivote: desde él todo destino distinto de CTRL01:443 y SIEM01:1514/1515 se deniega, por el Security Group y por FW01 (AM-18)"
    precondicion: "VPN establecida; EC2-GW con sg-gw; objetivos: CTRL01 10.20.20.10, SIEM01 10.20.50.10, ESX01 10.20.10.10, LABCLI01 10.20.35.50, EDGE01 10.20.60.10"
    comando: "nc -zv -w3 10.20.20.10 443 ; nc -zv -w3 10.20.50.10 1514 ; nc -zv -w3 10.20.20.10 22 ; nc -zv -w3 10.20.50.10 22 ; nc -zv -w3 10.20.10.10 443 ; nc -zv -w3 10.20.35.50 445 ; nc -zv -w3 10.20.60.10 3128"
    resultado_esperado: "Abren solo CTRL01:443 y SIEM01:1514; el resto se deniega"
    criterio_aprobacion:
      - { tipo: exit_code, valor: 0, comando_adicional: "nc -zv -w3 10.20.20.10 443" }
      - { tipo: exit_code, valor: 0, comando_adicional: "nc -zv -w3 10.20.50.10 1514" }
      - { tipo: exit_code, valor: distinto_de_0, comando_adicional: "nc -zv -w3 10.20.10.10 443", nota: "cualquier otro destino o puerto" }
      - { tipo: contador, metrica: paquetes_denegados_por_fw01, operador: ">", valor: 0 }
    automatizable: true
    critica: true
    polaridad: mixta
    evidencia_a_capturar: ["Salida de los nc", "Contadores de las reglas de FW01 para F30 y F13", "Registros de flujo de la VPC (REJECT) del sg-gw"]
    modos: [L, A, H]
    semestre: S2
    criterios_rubrica: [R3, R4]
    objetivos: [OD-06, OD-12]
    amenazas: [AM-18]
    detecciones: []
    celdas_matriz: ["AWS>MGMT", "AWS>LAB", "AWS>EDGE", "AWS>DMZ-SVC", "AWS>DMZ-HONEY"]
    ampliacion: true
    cambio: CI-41

  - id: T59
    categoria: continuidad
    nombre: "Restaurar la consola desde S3"
    origen: EC2-DR
    destino: S3
    flujos: []
    flujos_justificacion: "Restauración desde S3 por el Gateway Endpoint: no es un flujo F-nn permanente (EC2-DR y NAT-DR son temporales)"
    componentes: [EC2-DR, NAT-DR, S3, AWS-APP-A, CTRL01]
    objetivo_que_valida: "La consola se restaura desde la copia de S3 en una EC2 temporal de app-a en un RTO ≤ 2 h (D2.9); se crean EC2-DR y NAT-DR solo para el simulacro y se destruyen después"
    precondicion: "Respaldo restic reciente en S3 (F18); EC2-DR y NAT-DR creadas con OpenTofu con la etiqueta Ttl; clave de restic aportada por el equipo (no está en AWS)"
    comando: "restic -r s3:s3.amazonaws.com/celeris-backups restore latest --target /restauracion ; arrancar la consola restaurada y abrir su pantalla de inicio"
    resultado_esperado: "Consola operativa con los datos restaurados; RTO medido ≤ 2 h"
    criterio_aprobacion:
      - { tipo: exit_code, valor: 0, comando_adicional: "restic restore latest" }
      - { tipo: umbral, metrica: rto_h, operador: "<=", valor: 2 }
      - { tipo: regex, sobre: stdout, patron: "^200$", comando_adicional: "curl -sk -o /dev/null -w \"%{http_code}\" https://localhost/   # en EC2-DR, con la consola restaurada" }
      - { tipo: contador, metrica: recursos_con_ttl_tras_tofu_destroy, operador: "==", valor: 0, comando_adicional: "tofu destroy y verificación por etiqueta Ttl" }
    automatizable: true
    critica: false
    polaridad: positiva
    evidencia_a_capturar: ["Tiempo de la restauración", "Captura de la consola restaurada", "Salida de tofu destroy y verificación"]
