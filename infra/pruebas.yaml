  # ---------------------------------------------------------------------------------------------------------------
  # Ampliación T29+ (CI-27): pruebas que D1.16 no define y que la cobertura de la matriz exige. Ninguna sustituye a
  # T01–T28. `ampliacion: true` las distingue; `polaridad` dice si la prueba espera tráfico permitido o denegado.
  # Los modos son H (y A donde interviene AWS): el runner del Modo L (tests/network) aún no tiene casos para ellas.
  # ---------------------------------------------------------------------------------------------------------------

  - id: T29
    categoria: deteccion
    nombre: "Escaneo lateral detectado por IDS01"
    origen: KALI01
    destino: OBS01
    flujos: []
    flujos_justificacion: "Prueba de detección con tráfico denegado: ningún F-nn alcanza OBS01 desde LAB-TEST (SVC01 no sirve: F3 le abre el puerto 80 a LAB-TEST; F2, CI-04); IDS01 observa la VLAN 31 por su port group de captura"
    componentes: [KALI01, FW01, IDS01, SIEM01, OBS01]
    objetivo_que_valida: "Suricata IDS (DET-02) detecta el escaneo de red desde LAB-TEST hacia SERVERS aunque FW01 lo deniegue, y Wazuh lo correlaciona"
    precondicion: "KALI01 en 10.20.31.60; IDS01 con captura en las VLAN 20 y 31 y reglas ET Open al día; agente Wazuh en IDS01"
    comando: "nmap -Pn -sS -p 1-1024 --max-rate 100 10.20.20.20"
    resultado_esperado: "Sin puertos abiertos; alerta de Suricata en IDS01 y alerta de Wazuh de nivel ≥ 10 en menos de 60 s"
    criterio_aprobacion:
      - { tipo: contador, metrica: puertos_open, operador: "==", valor: 0, nota: "FW01 deniega LAB-TEST → OBS01" }
      - { tipo: regex, sobre: eve_json_ids01, patron: "\"signature\":\\s*\"[^\"]*([Ss][Cc][Aa][Nn]|escaneo)", nota: "firma de un barrido: ET SCAN en S2, regla local sid 9000001 en el Modo L" }
      - { tipo: regex, sobre: eve_json_ids01, patron: "\"src_ip\":\\s*\"10\\.20\\.31\\.60\"", nota: "la alerta nombra a KALI01 como origen" }
      - { tipo: regex, sobre: alerta_wazuh, patron: "\"level\":\\s*(1[0-9]|[2-9][0-9])" }
      - { tipo: umbral, metrica: latencia_alerta_wazuh_s, operador: "<", valor: 60, nota: "desde el primer SYN hasta la alerta en Wazuh" }
    automatizable: true
    critica: false
    polaridad: negativa
    evidencia_a_capturar: ["Salida de nmap", "Línea de eve.json de IDS01 con la alerta", "Alerta de Wazuh (JSON) con marca de tiempo", "Contador de las reglas de denegación de LAB-TEST hacia SERVERS en FW01"]
    modos: [L, H]
    semestre: S2
    criterios_rubrica: [R4, R5]
    objetivos: [OD-01, OD-09]
    amenazas: []
    detecciones: [DET-02]
    celdas_matriz: []
    ampliacion: true
    cambio: CI-27

