    comando: "nmap -sS -Pn 203.0.113.10"
    resultado_esperado: "Solo 80 y 443 (y señuelos en ventana autorizada)"
    criterio_aprobacion:
      - { tipo: regex, sobre: stdout, patron: "(?m)^(?!(80|443)/)\\d+/tcp\\s+open", debe_coincidir: false, nota: "22 y 23 se aceptan solo dentro de la ventana autorizada" }
      - { tipo: regex, sobre: stdout, patron: "(?m)^443/tcp\\s+open" }
    automatizable: true
    critica: false
    polaridad: mixta
    evidencia_a_capturar: ["Salida de nmap", "Alertas de Suricata IPS y CrowdSec por el escaneo", "Alerta en Wazuh"]
    modos: [L, H]
    semestre: S2
    criterios_rubrica: [R4, R5]
    objetivos: [OD-08, OD-09]
    amenazas: [AM-06]
    detecciones: [DET-01]
