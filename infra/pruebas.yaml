    critica: false
    polaridad: positiva
    evidencia_a_capturar: ["Cabeceras de respuesta (primera petición MISS y segunda HIT)", "Registro de acceso de Celeris"]
    modos: [L, H]
    semestre: S2
    criterios_rubrica: [R6]
    objetivos: [OD-03, OD-10]
    amenazas: []
    detecciones: []
