requisitos:
  REQ-F-01: Atender como proxy explícito HTTP y HTTPS (CONNECT) en un puerto configurable
  REQ-F-02: Descifrar TLS solo si el dominio está en la lista permitida, no está en la denegada y el SNI coincide con el CONNECT
  REQ-F-03: Cachear respuestas compartibles según RFC 9111
  REQ-F-04: Revalidar copias vencidas con If-None-Match / If-Modified-Since
  REQ-F-05: Coalescer peticiones concurrentes al mismo objeto ausente
  REQ-F-06: Guardar objetos por SHA-256 y verificar el hash antes de servir
  REQ-F-07: Normalizar claves con reglas declarativas (Store-ID, parámetros de rastreo)
  REQ-F-08: Servir peticiones Range (206) desde un objeto completo en caché
  REQ-F-09: Respetar un límite de disco expulsando lo menos usado
  REQ-F-10: Aceptar solo clientes de redes permitidas y limitar peticiones por IP
  REQ-F-11: Bloquear destinos internos (SSRF) y puertos de túnel no permitidos
  REQ-F-12: Publicar una página de transparencia generada desde la configuración real
  REQ-F-13: Exponer métricas Prometheus y trazas OTLP
  REQ-F-14: Emitir eventos de seguridad en OCSF hacia el SIEM
  REQ-F-15: Generar detecciones de actividad inusual por IP
  REQ-F-16: Enrolar nodos en el plano de control con mTLS
  REQ-F-17: Distribuir configuración versionada y firmada, con despliegue gradual y reversión
  REQ-F-18: Emitir y rotar una CA intermedia por nodo, limitada por Name Constraints
  REQ-F-19: Purgar contenido por URL, prefijo o etiqueta en toda la flota
  REQ-F-20: 'Simular una política: "¿este URL se descifraría y cachearía?" sin aplicarla'
  REQ-F-21: Repartir objetos entre nodos por hash consistente y consultar a un shield
  REQ-F-22: Ejecutar prefetch en una ventana horaria a partir de una lista firmada
  REQ-F-23: Validar manifiestos firmados de publishers (RFC 9421) y digests (RFC 9530)
  REQ-F-24: Registrar en auditoría todo cambio de configuración (quién, qué, cuándo)
  REQ-F-25: Exportar reportes de ahorro (GB evitados, BHR, costo por GB)
  REQ-F-26: Generar el archivo PAC con varios nodos y DIRECT de respaldo
  REQ-F-27: Alertar cuando se pide una honey-URL
  REQ-F-28: Eliminar de forma explícita las cabeceras que identifican al cliente (X-Forwarded-For, Via, Forwarded) antes de enviar una petición al origen o al shield
  REQ-F-29: Enviar los MISS a un proxy padre (shield) configurable, con mTLS
  REQ-F-30: Exportar el aviso de transparencia como sitio estático firmado para el portal
  REQ-NF-01: Latencia añadida p95 ≤ 5 ms en HIT desde memoria y ≤ 20 ms desde disco, en LAN
  REQ-NF-02: ≥ 5 000 conexiones concurrentes por nodo de 4 vCPU y 8 GB (meta a confirmar con prueba)
  REQ-NF-03: Disponibilidad para el usuario ≥ 99,5 % mensual gracias al DIRECT del PAC y al DNS secundario
  REQ-NF-04: Tras un corte de energía, ningún objeto corrupto se sirve
  REQ-NF-05: La llave de una CA nunca sale de su nodo; la raíz vive offline
  REQ-NF-06: TLS ≥ 1.2 hacia clientes y orígenes; X25519MLKEM768 preferido cuando ambos lo soporten
  REQ-NF-07: No se guardan cookies, credenciales, cuerpos de peticiones ni parámetros de URL
  REQ-NF-08: Ante error al evaluar la política, el nodo no intercepta (passthrough)
  REQ-NF-09: Cobertura ≥ 70 % en policy, cache y tls; clippy sin advertencias
  REQ-NF-10: Compila para Linux x86_64 y aarch64 y para Windows x86_64; imagen OCI multi-arquitectura
  REQ-NF-11: HTTP/1.1 y HTTP/2 con clientes; cabecera Cache-Status (RFC 9211); eventos OCSF 1.x
  REQ-NF-12: Panel con SUS ≥ 75 en la validación con usuarios
  REQ-NF-13: Cada decisión (HIT, MISS, bypass, rechazo) produce una métrica
  REQ-NF-14: El puerto de administración y métricas solo acepta TLS (o mTLS); el token nunca viaja en claro
