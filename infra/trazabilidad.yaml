# infra/trazabilidad.yaml — Objetivos, amenazas, detecciones, figuras, rúbrica y correspondencia con el DOCX (CE0311).
# Transcrito de D1.6, D1.9, D1.14, D1.17, la plantilla S1_E1 y la rúbrica oficial.
# Los IDs OD-xx, AM-xx, DET-xx se asignan por orden de fila de cada tabla del documento maestro (CI-20);
# el documento los nombra solo por posición ("#", filas).
# Los catálogos de supuestos, decisiones y requisitos (final del archivo) se generan de A6, C3.4 y C1.2–C1.4.

meta:
  version: "1.0"
  fecha: "2026-11-18"
  documento_base: "docs/Celeris-Edge-Documento-Maestro.md (D1.6, D1.9, D1.14, D1.17)"
  plantilla: docs/fuentes/CE03/S1_E1_Analisis_y_Diseno_de_Red.docx
  rubrica_oficial: docs/fuentes/CE03/Rubrica_S1_E1_Diseno_de_Red.xlsx

# Objetivos medibles (D1.6)
objetivos:
  - { id: OD-01, objetivo: "Segmentar por zonas", indicador: "Servidores críticos en VLAN dedicadas", meta: "100 %", responsable: "Diseño de red" }
  - { id: OD-02, objetivo: "Aislar la gestión", indicador: "Interfaces de gestión alcanzables solo desde JMP01 (VLAN 10)", meta: "100 %", responsable: Seguridad }
  - { id: OD-03, objetivo: "Rutas alternas", indicador: "Rutas de salida para un usuario", meta: "≥ 3 (EDGE01, EDGE02, DIRECT)", responsable: "Diseño de red" }
  - { id: OD-04, objetivo: "Resolución sin punto único", indicador: "Servidores DNS por cliente", meta: "2 (SVC01 + FW01)", responsable: "Diseño de red" }
  - { id: OD-05, objetivo: "Enlace híbrido redundante", indicador: "Túneles VPN configurados / convergencia medida", meta: "2 túneles; ≤ 60 s", responsable: Infraestructura }
  - { id: OD-06, objetivo: "Política por defecto", indicador: "Tráfico entre zonas con regla explícita y registro", meta: "100 %, deny-all en el resto", responsable: Seguridad }
  - { id: OD-07, objetivo: "Protección en tránsito", indicador: "Flujos con protección criptográfica o riesgo aceptado documentado", meta: "100 % de los flujos de D1.11", responsable: Seguridad }
  - { id: OD-08, objetivo: "Servicio expuesto endurecido", indicador: "Calificación TLS del portal; puertos abiertos desde Internet", meta: "≥ A; solo 80/443 (+ señuelos en ventana autorizada)", responsable: Seguridad }
  - { id: OD-09, objetivo: "Detección", indicador: "Escenarios de ataque planificados detectados en S2", meta: "≥ 90 %", responsable: Seguridad }
  - { id: OD-10, objetivo: "Adopción del proxy", indicador: "Bytes HTTP(S) de LAB que pasan por la caché", meta: "Se mide en el piloto; meta ≥ 90 % en modo gestionado", responsable: "Diseño de red" }

# Modelo de amenazas STRIDE (D1.9). `pruebas` lista T-nn; si no hay, `prueba_justificacion`.
amenazas:
  - { id: AM-01, zona_activo: "LAB → proxy", stride: [S], amenaza: "Equipo no institucional usa el proxy", control: "Reservas DHCP + allowed_clients + port-security (802.1X en H2)", iso_27002: ["8.20", "8.22"], componentes: [EDGE01, EDGE02, FW01, SW-ACC], pruebas: [T13] }
  - { id: AM-02, zona_activo: LAB, stride: [S], amenaza: "Secuestro de WPAD", control: "URL fija del PAC por GPO", iso_27002: ["8.20"], componentes: [SVC01, EDGE01], pruebas: [T22] }
  - { id: AM-03, zona_activo: LAB, stride: [T], amenaza: "DHCP o RA falso", control: "DHCP snooping, RA guard", iso_27002: ["8.20"], componentes: [SW-ACC, SW-CORE01], pruebas: [T23] }
  - { id: AM-04, zona_activo: Proxy, stride: [E], amenaza: "Usar el proxy para alcanzar redes internas (SSRF)", control: "allowed_internal_networks, puertos limitados", iso_27002: ["8.22"], componentes: [EDGE01, EDGE02], pruebas: [T13, T14] }
  - { id: AM-05, zona_activo: Portal, stride: [T], amenaza: "Desfiguración o inyección", control: "WAF + sitio estático firmado + FS solo lectura", iso_27002: ["8.23", "8.26"], componentes: [WAF01, WEB01], pruebas: [T17, T18] }
  - { id: AM-06, zona_activo: Portal, stride: [D], amenaza: "Saturación de peticiones", control: "Límite por IP en WAF, CrowdSec", iso_27002: ["8.20"], componentes: [WAF01, FW01], pruebas: [T15] }
  - { id: AM-07, zona_activo: "Túnel AWS", stride: [I], amenaza: "Datos personales hacia la nube", control: "Quitar cabeceras del cliente (REQ-F-28) + IPsec", iso_27002: ["5.14", "8.24"], componentes: [EDGE01, EDGE02, VTI1, VTI2, VGW, EC2-SHIELD], pruebas: [T26] }
  - { id: AM-08, zona_activo: Métricas, stride: [I], amenaza: "Token de administración en claro", control: "TLS en 9128 (REQ-NF-14)", iso_27002: ["8.24"], componentes: [OBS01, EDGE01, EDGE02], pruebas: [T27] }
  - { id: AM-09, zona_activo: Syslog, stride: [I, T], amenaza: "Logs del firewall leídos o alterados en tránsito", control: "Syslog sobre TLS 6514", iso_27002: ["8.15", "8.24"], componentes: [FW01, SIEM01], pruebas: [T28] }
  - { id: AM-10, zona_activo: DMZ-HONEY, stride: [E], amenaza: "Honeypot comprometido como trampolín", control: "VLAN propia, sin salida", iso_27002: ["8.22"], componentes: [HNY01, FW01], pruebas: [T20] }
  - { id: AM-11, zona_activo: MGMT, stride: [E], amenaza: "Acceso administrativo desde LAB", control: "MGMT solo desde JMP01 + MFA", iso_27002: ["8.2", "8.22"], componentes: [JMP01, FW01], pruebas: [T06] }
  - { id: AM-12, zona_activo: FW01, stride: [D], amenaza: "Caída del firewall virtual", control: "Break-glass, XML en Git, CARP en H3", iso_27002: ["8.14"], componentes: [FW01, BRK01], pruebas: [T25] }
  - id: AM-13
    zona_activo: Cualquiera
    stride: [R]
    amenaza: "Acciones sin rastro"
    control: "Registro en todas las denegaciones, auditoría de cambios, NTP/NTS"
    iso_27002: ["8.15", "8.17"]
    componentes: [FW01, SIEM01, SVC01]
    pruebas: []
    prueba_justificacion: "D1.9 indica «Revisión de logs», no un T-nn; se revisa el registro de denegaciones de FW01 y la sincronización NTS en S2"
    pendiente: true
    cambio: CI-18

# Detecciones (D1.14). `ubicacion` es el componente donde reside el sensor o control.
detecciones:
  - id: DET-01
    tecnologia: "Suricata IPS (FW01)"
    ubicacion: FW01
    ubicacion_detalle: "Inline en WAN y DMZ-SVC"
    que_detecta: "Escaneos, explotación conocida (ET Open), protocolos anómalos"
    attack: [T1595, T1190]
    validacion: { escenario: "nmap -sS y nikto contra 203.0.113.10 desde fuera", pruebas: [T15] }
  - id: DET-02
    tecnologia: "Suricata IDS (IDS01)"
    ubicacion: IDS01
    ubicacion_detalle: "Interfaces de captura en las VLAN 10, 20, 31 y 50 (no en 30/60)"
    que_detecta: "Movimiento lateral, C2, DNS sospechoso, acceso a gestión"
    attack: [T1046, T1021, T1071]
    validacion: { escenario: "Escaneo desde KALI01 hacia SERVERS", pruebas: [] }
    pendiente: true
    cambio: CI-17
  - id: DET-03
    tecnologia: "WAF (WAF01)"
    ubicacion: WAF01
    ubicacion_detalle: "Delante del portal"
    que_detecta: "Inyección SQL, XSS, recorrido de rutas, escáneres web"
    attack: [T1190]
    validacion: { escenario: "Payloads de prueba → 403 + alerta (T18)", pruebas: [T18] }
  - id: DET-04
    tecnologia: "OpenCanary + Cowrie (HNY01)"
    ubicacion: HNY01
    ubicacion_detalle: "DMZ-HONEY"
    que_detecta: "Fuerza bruta SSH/Telnet, comandos del atacante"
    attack: [T1110, T1059]
    validacion: { escenario: "hydra contra el puerto 22 publicado", pruebas: [T11] }
  - id: DET-05
    tecnologia: "Canary interno (HNY02)"
    ubicacion: HNY02
    ubicacion_detalle: "LAB"
    que_detecta: "Cualquier escaneo dentro de LAB (tráfico que el firewall no ve)"
    attack: [T1046]
    validacion: { escenario: "Barrido de puertos desde un equipo de LAB", pruebas: [] }
    pendiente: true
    cambio: CI-17
  - id: DET-06
    tecnologia: "Detecciones Celeris"
    ubicacion: EDGE01
    ubicacion_detalle: "EDGE (EDGE01 y EDGE02)"
    que_detecta: "Abuso del proxy, puertos raros, nombre que no coincide, volumen"
    attack: [T1090]
    validacion: { escenario: "siem/simular-ataques.ps1 (ya existe)", pruebas: [T13, T14] }
  - id: DET-07
    tecnologia: "Honey-URLs"
    ubicacion: EDGE01
    ubicacion_detalle: "EDGE (EDGE01 y EDGE02)"
    que_detecta: "Herramientas que recorren rutas que ningún usuario visita"
    attack: [T1595.003]
    validacion: { escenario: "Pedir la URL señuelo", pruebas: [] }
    pendiente: true
    cambio: CI-17
  - id: DET-08
    tecnologia: "CrowdSec (FW01)"
    ubicacion: FW01
    ubicacion_detalle: "WAN"
    que_detecta: "IP con comportamiento abusivo conocido"
    attack: [T1110, T1595]
    validacion: { escenario: "Simulación con su escenario de prueba", pruebas: [] }
    pendiente: true
    cambio: CI-17
  - id: DET-09
    tecnologia: Wazuh
    ubicacion: SIEM01
    ubicacion_detalle: SECURITY
    que_detecta: "Correlación de todo lo anterior; integridad de archivos del portal"
    attack: []
    validacion: { escenario: "Cada escenario produce una alerta con nivel ≥ 10", pruebas: [T11, T18] }

