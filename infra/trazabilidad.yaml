# infra/trazabilidad.yaml — Objetivos, amenazas, detecciones, figuras, rúbrica y correspondencia con el DOCX (CE0311).
# Transcrito de D1.6, D1.9, D1.14, D1.17, la plantilla S1_E1 y la rúbrica oficial.
# Los IDs OD-xx, AM-xx, DET-xx se asignan por orden de fila de cada tabla del documento maestro (CI-20);
# el documento los nombra solo por posición ("#", filas).
# Los catálogos de supuestos, decisiones y requisitos (final del archivo) se generan de A6, C3.4 y C1.2–C1.4.

meta:
  version: "1.1"
  fecha: "2026-11-22"
  documento_base: "docs/celeris/Celeris-CE03-Infraestructura.md v0.4 (D1.6, D1.9, D1.14, D1.17, D3, D7); base v0.2: docs/Celeris-Edge-Documento-Maestro.md"
  plantilla: docs/fuentes/CE03/S1_E1_Analisis_y_Diseno_de_Red.docx
  rubrica_oficial: docs/fuentes/CE03/Rubrica_S1_E1_Diseno_de_Red.xlsx

# Objetivos medibles (D1.6)
# Objetivos del proyecto (CE01, resumidos en 00 Marco común M2.3) y la necesidad que expresa cada uno. Cada OD-xx los
# cita en `objetivo_proyecto` (CE03 D1.6, columna «Objetivo del proyecto»; CI-75). OD-05 no cita ninguno en D1.6.
objetivos_proyecto:
  - { id: OB-1, necesidad: "Ahorro de Internet", indicador: "GB evitados por mes; BHR", meta: "BHR ≥ 25 % [S-04]" }
  - { id: OB-2, necesidad: "Ahorro de tiempo", indicador: "Tiempo de descarga para dejar listo un laboratorio de 40 PCs", meta: "−70 %" }
  - { id: OB-3, necesidad: "Autonomía del encargado", indicador: "Tiempo para habilitar una fuente o un laboratorio", meta: "≤ 5 min" }
  - { id: OB-4, necesidad: "Transparencia", indicador: "PCs con aviso entregado antes de instalar la CA", meta: "100 %" }
  - { id: OB-5, necesidad: "Seguridad del servicio", indicador: "Escenarios de abuso planificados detectados", meta: "≥ 90 % en S2" }

objetivos:
  - { id: OD-01, objetivo: "Segmentar por zonas", indicador: "Servidores críticos en VLAN dedicadas", meta: "100 %", responsable: "Diseño de red", objetivo_proyecto: [OB-5] }
  - { id: OD-02, objetivo: "Aislar la gestión", indicador: "Interfaces de gestión alcanzables solo desde JMP01 (VLAN 10)", meta: "100 %", responsable: Seguridad, objetivo_proyecto: [OB-5] }
  - { id: OD-03, objetivo: "Rutas alternas", indicador: "Rutas de salida para un usuario", meta: "≥ 3 (EDGE01, EDGE02, DIRECT)", responsable: "Diseño de red", objetivo_proyecto: [OB-1, OB-2] }
  - { id: OD-04, objetivo: "Resolución DNS confiable", indicador: "Resolvedor con DNSSEC en FW01; sin dependencia oculta (si FW01 cae, no hay ruteo)", meta: "1 resolvedor validado + `DIRECT` del PAC", responsable: "Diseño de red", objetivo_proyecto: [OB-2] }
  - { id: OD-05, objetivo: "Enlace híbrido redundante", indicador: "Túneles VPN configurados / convergencia medida", meta: "2 túneles; ≤ 60 s", responsable: Infraestructura, objetivo_proyecto: [] }
  - { id: OD-06, objetivo: "Política por defecto", indicador: "Tráfico entre zonas con regla explícita y registro", meta: "100 %, deny-all en el resto", responsable: Seguridad, objetivo_proyecto: [OB-5] }
  - { id: OD-07, objetivo: "Protección en tránsito", indicador: "Flujos con protección criptográfica o riesgo aceptado documentado", meta: "100 % de los flujos de D1.11", responsable: Seguridad, objetivo_proyecto: [OB-4] }
  - { id: OD-08, objetivo: "Servicio expuesto endurecido", indicador: "Calificación TLS del portal y de EC2-GW; puertos abiertos desde Internet", meta: "≥ A; solo 80/443 (+ señuelos en ventana autorizada)", responsable: Seguridad, objetivo_proyecto: [OB-4] }
  - { id: OD-09, objetivo: "Detección", indicador: "Escenarios de ataque planificados detectados en S2", meta: "≥ 90 %", responsable: Seguridad, objetivo_proyecto: [OB-5] }
  - { id: OD-10, objetivo: "Adopción del proxy", indicador: "Bytes HTTP(S) de LAB que pasan por la caché", meta: "Se mide en el piloto; meta ≥ 90 % en modo gestionado", responsable: "Diseño de red", objetivo_proyecto: [OB-1] }
  - { id: OD-11, objetivo: "Acceso por laboratorio", indicador: "Laboratorios con rango propio que el encargado habilita", meta: "10 de 10", responsable: "Diseño de red", objetivo_proyecto: [OB-3] }
  - { id: OD-12, objetivo: "Panel remoto sin exponer el campus", indicador: "Puertos del campus que alcanzan CTRL01 desde Internet", meta: "0", responsable: Seguridad, objetivo_proyecto: [OB-3, OB-5] }

# Modelo de amenazas STRIDE (D1.9). `pruebas` lista T-nn; si no hay, `prueba_justificacion`.
amenazas:
  - { id: AM-01, zona_activo: "LAB → proxy", stride: [S], amenaza: "Equipo no institucional o de un laboratorio deshabilitado usa la caché", control: "Rangos habilitados + reservas DHCP + port-security", iso_27002: ["8.20", "8.22"], componentes: [EDGE01, EDGE02, FW01, SW-ACC], pruebas: [T13, T52] }
  - { id: AM-02, zona_activo: "LAB", stride: [S], amenaza: "Secuestro de WPAD", control: "URL fija del PAC por GPO", iso_27002: ["8.20"], componentes: [EDGE01, EDGE02], pruebas: [T60] }
  - { id: AM-03, zona_activo: "LAB", stride: [T], amenaza: "DHCP o RA falso", control: "DHCP snooping, RA guard", iso_27002: ["8.20"], componentes: [SW-ACC, SW-CORE01], pruebas: [T23] }
  - { id: AM-04, zona_activo: "Proxy", stride: [E], amenaza: "Usar el proxy para alcanzar redes internas (SSRF)", control: "allowed_internal_networks, puertos limitados", iso_27002: ["8.22"], componentes: [EDGE01, EDGE02], pruebas: [T13, T14] }
  - { id: AM-05, zona_activo: "Portal", stride: [T], amenaza: "Desfiguración o inyección", control: "WAF + sitio estático firmado + FS solo lectura", iso_27002: ["8.23", "8.26"], componentes: [PORTAL01], pruebas: [T17, T18] }
  - { id: AM-06, zona_activo: "Portal", stride: [D], amenaza: "Saturación de peticiones", control: "Límite por IP en WAF, CrowdSec", iso_27002: ["8.20"], componentes: [PORTAL01, FW01], pruebas: [T15, T32] }
  - { id: AM-07, zona_activo: "Orígenes / nube", stride: [I], amenaza: "Datos personales hacia Internet o AWS", control: "Quitar cabeceras del cliente (REQ-F-28); KPI solo por laboratorio", iso_27002: ["5.14", "8.24"], componentes: [EDGE01, EDGE02], pruebas: [T26] }
  - { id: AM-08, zona_activo: "Administración", stride: [I], amenaza: "Token o sesión en claro", control: "TLS obligatorio (REQ-NF-14)", iso_27002: ["8.24"], componentes: [EDGE01, EDGE02, CTRL01], pruebas: [T27] }
  - { id: AM-09, zona_activo: "Syslog", stride: [I, T], amenaza: "Logs del firewall leídos o alterados en tránsito", control: "Syslog sobre TLS 6514", iso_27002: ["8.15", "8.24"], componentes: [FW01, SIEM01], pruebas: [T28] }
  - { id: AM-10, zona_activo: "DMZ-HONEY", stride: [E], amenaza: "Honeypot comprometido como trampolín", control: "VLAN propia, sin salida", iso_27002: ["8.22"], componentes: [HNY01, FW01], pruebas: [T20, T47] }
  - { id: AM-11, zona_activo: "MGMT", stride: [E], amenaza: "Acceso administrativo desde LAB o Wi-Fi", control: "MGMT solo desde JMP01 + MFA", iso_27002: ["8.2", "8.22"], componentes: [JMP01, FW01], pruebas: [T06, T34, T57] }
  - { id: AM-12, zona_activo: "FW01", stride: [D], amenaza: "Caída del firewall virtual", control: "Break-glass, XML en Git, CARP en H3", iso_27002: ["8.14"], componentes: [FW01, BRK01], pruebas: [T25] }
  - { id: AM-13, zona_activo: "Cualquiera", stride: [R], amenaza: "Acciones sin rastro", control: "Registro de denegaciones, auditoría de la consola, NTP/NTS", iso_27002: ["8.15", "8.17"], componentes: [FW01, SIEM01, CTRL01], pruebas: [T33] }
  - { id: AM-14, zona_activo: "Panel remoto", stride: [S, E], amenaza: "Suplantar al encargado desde Internet o ampliar el descifrado con una sesión robada", control: "2FA, límite de intentos, WAF, acciones críticas solo desde el campus", iso_27002: ["5.15", "8.5"], componentes: [EC2-GW, CTRL01], pruebas: [T53, T54] }
  - { id: AM-15, zona_activo: "Nodo", stride: [T], amenaza: "Configuración alterada en tránsito o inyectada", control: "Firma ed25519; rechazo de lo no firmado o más antiguo", iso_27002: ["8.24"], componentes: [CTRL01, EDGE01, EDGE02], pruebas: [T51] }
  - { id: AM-16, zona_activo: "Enlace", stride: [D], amenaza: "Precarga satura el enlace en horario de clase", control: "Ventana horaria y límite (REQ-RN-10)", iso_27002: ["8.6"], componentes: [CTRL01, EDGE01, EDGE02], pruebas: [T50] }
  - { id: AM-17, zona_activo: "BYOD", stride: [I, E], amenaza: "Descifrar tráfico de un equipo personal, o que un equipo personal alcance servidores o laboratorios", control: "REQ-F-36, RN-11; Wi-Fi solo a EDGE y portal", iso_27002: ["5.34", "8.22"], componentes: [WIFI-EST, EDGE01, EDGE02, FW01], pruebas: [T56, T57] }
  - { id: AM-18, zona_activo: "EC2-GW", stride: [E], amenaza: "Gateway comprometido usado para pivotar al campus", control: "SG y FW01 solo permiten CTRL01:443 con mTLS; sin datos ni llaves en EC2-GW; recreable", iso_27002: ["8.22"], componentes: [EC2-GW, FW01], pruebas: [T58] }

# Detecciones (D1.14). `ubicacion` es el componente donde reside el sensor o control.
detecciones:
  - id: DET-01
    tecnologia: "Suricata IPS (FW01)"
    ubicacion: FW01
    ubicacion_detalle: "Inline en tránsito/WAN y DMZ-SVC"
    que_detecta: "Escaneos, explotación conocida (ET Open), protocolos anómalos"
    attack: [T1595, T1190]
    validacion: { escenario: "nmap -sS y nikto contra 203.0.113.10 desde fuera", pruebas: [T15] }
  - id: DET-02
    tecnologia: "Suricata IDS (FW01)"
    ubicacion: FW01
    ubicacion_detalle: "Interfaces LAB y SERVERS (v0.4: sustituye al sensor separado retirado, CI-39)"
    que_detecta: "Escaneos hacia servidores y gestión, movimiento lateral entre zonas"
    attack: [T1046, T1021]
    validacion: { escenario: "Escaneo desde KALI01 (LAB) hacia SERVERS", pruebas: [T29] }
  - id: DET-03
    tecnologia: "WAF (PORTAL01)"
    ubicacion: PORTAL01
    ubicacion_detalle: "Delante del portal"
    que_detecta: "Inyección SQL, XSS, recorrido de rutas, escáneres web"
    attack: [T1190]
    validacion: { escenario: "Payloads de prueba → 403 + alerta (T18)", pruebas: [T18] }
  - id: DET-04
    tecnologia: "OpenCanary + Cowrie (HNY01)"
    ubicacion: HNY01
    ubicacion_detalle: "DMZ-HONEY"
    que_detecta: "Fuerza bruta SSH/Telnet, comandos del atacante"
    attack: [T1110, T1059]
    validacion: { escenario: "hydra contra el puerto 22 publicado", pruebas: [T11] }
  - id: DET-05
    tecnologia: "Canary interno (HNY02)"
    ubicacion: HNY02
    ubicacion_detalle: "LAB"
    que_detecta: "Cualquier escaneo dentro de LAB (tráfico que el firewall no ve)"
    attack: [T1046]
    validacion: { escenario: "Barrido de puertos desde un equipo de LAB", pruebas: [T30] }
  - id: DET-06
    tecnologia: "Detecciones Celeris"
    ubicacion: EDGE01
    ubicacion_detalle: "EDGE (EDGE01 y EDGE02)"
    que_detecta: "Abuso del proxy, puertos raros, nombre que no coincide, volumen"
    attack: [T1090]
    validacion: { escenario: "siem/simular-ataques.ps1 (ya existe)", pruebas: [T13, T14] }
  - id: DET-07
    tecnologia: "Honey-URLs"
    ubicacion: EDGE01
    ubicacion_detalle: "EDGE (EDGE01 y EDGE02)"
    que_detecta: "Herramientas que recorren rutas que ningún usuario visita"
    attack: [T1595.003]
    validacion: { escenario: "Pedir la URL señuelo", pruebas: [T31] }
  - id: DET-08
    tecnologia: "CrowdSec (FW01)"
    ubicacion: FW01
    ubicacion_detalle: "Tránsito/WAN"
    que_detecta: "IP con comportamiento abusivo conocido"
    attack: [T1110, T1595]
    validacion: { escenario: "Simulación con su escenario de prueba", pruebas: [T32] }
  - id: DET-09
    tecnologia: Wazuh
    ubicacion: SIEM01
    ubicacion_detalle: SECURITY
    que_detecta: "Correlación de todo lo anterior; integridad de archivos del portal"
    attack: []
    validacion: { escenario: "Cada escenario produce una alerta con nivel ≥ 10", pruebas: [T11, T18] }
  - id: DET-10
    tecnologia: "Auditoría de la consola"
    ubicacion: CTRL01
    ubicacion_detalle: "CTRL01 (SERVERS)"
    que_detecta: "Inicios de sesión fallidos, acciones críticas intentadas desde remoto, cambios fuera de horario"
    attack: [T1078, T1110]
    validacion: { escenario: "Login remoto sin segundo factor y aprobación de una fuente desde EC2-GW", pruebas: [T53, T54] }
  - id: DET-11
    tecnologia: "WAF de EC2-GW (Coraza)"
    ubicacion: EC2-GW
    ubicacion_detalle: "AWS, subred pub-a"
    que_detecta: "Escaneos y ataques web contra el panel remoto"
    attack: [T1190, T1595]
    validacion: { escenario: "10 intentos de inicio de sesión fallidos contra EC2-GW", pruebas: [T53] }

