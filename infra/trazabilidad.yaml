# Rúbrica oficial (8 criterios). El descriptor de nivel 4 se copia del XLSX oficial; V-34 lo compara.
rubrica:
  R1:
    nombre: "Contexto y alcance del diseño de red"
    peso: 10
    descriptor_nivel_4: "Define organización, procesos críticos dependientes de la red, partes interesadas y una declaración de alcance de red completa, con límites y exclusiones justificadas."
    evidencias:
      - { tipo: seccion_docx, ref: "2.1" }
      - { tipo: seccion_docx, ref: "2.2" }
      - { tipo: seccion_docx, ref: "2.3" }
      - { tipo: seccion_docx, ref: "3.1" }
      - { tipo: seccion_docx, ref: "3.2" }
      - { tipo: seccion_docx, ref: "3.3", detalle: "Exclusiones justificadas, incluida la capa de acceso [S-14]" }
      - { tipo: figura, ref: FIG-1.1 }
  R2:
    nombre: "Arquitectura lógica de red: VLAN, subredes y direccionamiento"
    peso: 20
    descriptor_nivel_4: "Presenta VLAN, subredes, direccionamiento, gateways y ruteo completos y coherentes, con matriz de comunicación permitida/denegada entre zonas."
    evidencias:
      - { tipo: seccion_docx, ref: "5.2", detalle: "Direccionamiento, gateways, ruteo, servicios base y matriz zona × zona con IDs de flujo" }
      - { tipo: seccion_docx, ref: "7.3" }
      - { tipo: figura, ref: FIG-5.2 }
      - { tipo: hoja_xlsx, ref: XLSX-COMP }
      - { tipo: prueba, ref: T03 }
      - { tipo: prueba, ref: T06 }
      - { tipo: prueba, ref: T09 }
      - { tipo: prueba, ref: T10 }
      - { tipo: prueba, ref: T23 }
      - { tipo: prueba, ref: T34 }
      - { tipo: prueba, ref: T52 }
      - { tipo: prueba, ref: T60 }
  R3:
    nombre: "Diseño de conectividad híbrida (VPN)"
    peso: 15
    descriptor_nivel_4: "Especifica ambos extremos, redes anunciadas, tipo de túnel y cifrado previsto, con matriz de pruebas de conectividad planeadas coherente con el diseño."
    elementos_evaluados:
      - { id: R3-01, elemento: "Ida: ON-PREM → AWS por la VPN", pruebas: [T01] }
      - { id: R3-02, elemento: "Vuelta: AWS → ON-PREM por la VPN, solo EC2-GW → CTRL01:443 (F30)", pruebas: [T02] }
      - { id: R3-03, elemento: "Redundancia: falla de un túnel y convergencia BGP medida", pruebas: [T05] }
      - { id: R3-04, elemento: "MTU 1400 y MSS 1360 sin fragmentación", pruebas: [T21] }
      - { id: R3-05, elemento: "Función real de la VPN: EC2-GW no es un pivote hacia el campus (F30, F13)", pruebas: [T58] }
      - { id: R3-06, elemento: "Sin exposición pública del lado AWS", pruebas: [T04] }
      - { id: R3-07, elemento: "Zonas no autorizadas (DMZ) no cruzan hacia AWS", pruebas: [T03] }
      - { id: R3-08, elemento: "Protección de F13 y F30 en tránsito (IPsec + mTLS)", pruebas: [T05, T27, T58] }
    evidencias:
      - { tipo: seccion_docx, ref: "5.4", detalle: "D1.10 completa: activo/pasivo, MTU/MSS, BGP" }
      - { tipo: seccion_docx, ref: "6" }
      - { tipo: figura, ref: FIG-5.4 }
