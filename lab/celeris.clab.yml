    fw01-sim:
      kind: linux
      image: celeris-lab/base:dev
      binds:
      - generated/fw01-sim:/lab:ro
      - .run/pki:/pki:ro
      env:
        ESPERA_IFACES: eth1 eth2 eth3 eth4 eth5 eth6 eth7 eth8
      cap-add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.conf.all.rp_filter: 0
