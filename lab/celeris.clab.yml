# GENERADO por infra/gen/lab.py desde infra/inventory.yaml — no editar a mano (make lab-gen).
# Laboratorio EMULADO (Modo L, Parte F4): no es el producto real. Las IP de cada nodo están en lab/generated/<nodo>/arranque.sh.
name: celeris
mgmt:
  network: celeris-mgmt
  ipv4-subnet: 172.30.250.0/24
topology:
  nodes:
    br-vlan10:
      kind: bridge
    br-vlan20:
      kind: bridge
    br-vlan30:
      kind: bridge
    br-vlan40:
      kind: bridge
    br-vlan41:
