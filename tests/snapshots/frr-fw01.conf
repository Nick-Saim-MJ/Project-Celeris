! GENERADO por infra/gen desde infra/inventory.yaml — no editar a mano. EMULADO (Modo L, Parte F4.2): no es el producto real.
frr defaults traditional
hostname fw01-sim
log stdout
!
router bgp 65020
 bgp router-id 169.254.10.2
 no bgp ebgp-requires-policy
 neighbor 169.254.10.1 remote-as 64512
 neighbor 169.254.10.1 timers 10 30
 neighbor 169.254.10.1 description tunel1-activo
 neighbor 169.254.11.1 remote-as 64512
 neighbor 169.254.11.1 timers 10 30
 neighbor 169.254.11.1 description tunel2-respaldo
 !
 address-family ipv4 unicast
  network 10.20.0.0/16
  neighbor 169.254.10.1 activate
  neighbor 169.254.11.1 activate
  neighbor 169.254.11.1 route-map PREPEND-TUNEL2 out
 exit-address-family
!
route-map PREPEND-TUNEL2 permit 10
 set as-path prepend 65020
!
line vty
!
