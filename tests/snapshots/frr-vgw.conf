! GENERADO por infra/gen desde infra/inventory.yaml — no editar a mano. EMULADO (Modo L, Parte F4.2): no es el producto real.
frr defaults traditional
hostname vgw-sim
log stdout
!
ip route 10.30.0.0/16 Null0
!
router bgp 64512
 bgp router-id 169.254.10.1
 no bgp ebgp-requires-policy
 neighbor 169.254.10.2 remote-as 65020
 neighbor 169.254.10.2 timers 10 30
 neighbor 169.254.10.2 description tunel1-activo
 neighbor 169.254.11.2 remote-as 65020
 neighbor 169.254.11.2 timers 10 30
 neighbor 169.254.11.2 description tunel2-respaldo
 !
 address-family ipv4 unicast
  maximum-paths 1
  network 10.30.0.0/16
  neighbor 169.254.10.2 activate
  neighbor 169.254.11.2 activate
 exit-address-family
!
line vty
!
